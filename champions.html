<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Island · Champions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.wrap{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:flex-end;gap:12px}
.head img{height:130px;flex:none}
.head .card{flex:1;min-width:0}
.head h2{margin:0;font-size:28px;font-weight:900}
.head h2 .ar{font-size:22px;color:var(--ink);margin-left:6px}
.head p{margin:4px 0 0;font-weight:800;color:var(--ink);font-size:14.5px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.board li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:10px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:900;font-size:18px}
.board li .r{font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.board li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .sc{font-variant-numeric:tabular-nums;color:var(--primary-d)}
.board li.top1{border-color:#f2c94c;background:#fff9e3}
.board li.top2{border-color:#cfd8dc}
.board li.top3{border-color:#e0b48a}
.board li.me{border-color:var(--ok);box-shadow:0 0 0 3px rgba(46,158,107,.2)}
.board li .you{font-size:12px;background:var(--ok);color:#fff;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.empty{text-align:center;font-weight:800;color:var(--ink);padding:18px 8px}
.mine{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mine b{font-size:20px}
.note{font-size:13px;font-weight:700;color:var(--ink);text-align:center;margin:0}
@media (max-width:520px){ .head img{height:86px} .head h2{font-size:22px} .board li{font-size:16px;grid-template-columns:40px minmax(0,1fr) auto;padding:7px 10px} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="map.html" title="Back to the map" data-ar-label="رجوع للخريطة">
      <div class="logo" aria-hidden="true">🏆</div>
      <div><h1 data-ar="الأبطال">Champions</h1><p id="chSub">This chapter</p></div>
    </a>
    <div class="hud">
      <a class="pill" href="map.html" data-ar="‹ الخريطة">‹ Map</a>
    </div>
  </header>
  <div class="wrap">
    <div class="head">
      <img src="assets/parrot_celebrate.png" alt="Koko the parrot" data-ar-label="الببغاء كوكو">
      <div class="card">
        <h2 data-ar="أفضل ١٠ أبطال هذا الأسبوع">This week’s top 10 <span class="ar">أبطال الأسبوع</span></h2>
        <p id="reset"></p>
      </div>
    </div>
    <div class="card mine" id="mine" hidden></div>
    <div class="card">
      <ol class="board" id="board" aria-live="polite"><li class="empty" style="display:block;border:0" data-ar="جاري التحميل…">Loading…</li></ol>
    </div>
    <p class="note" id="note"></p>
    <div class="row"><a class="btn primary big" href="quiz.html#quest" data-ar="العب تحدي الفصل ◂">Play Chapter Quest ▸</a></div>
  </div>
</div>
<script src="firebase-config.js"></script>
<script src="chapters.js"></script>
<script src="common.js"></script>
<script>
(async () => {
  'use strict';
  const me = SI.requirePlayer(); if (!me) return;
  const CH = SI.requireChapter(); if (!CH) return;
  SI.applyTheme();
  const $ = s => document.querySelector(s), T = SI.T;
  if (SI.isAr()) document.title = 'الأبطال · جزيرة العلوم';
  $('#chSub').textContent = T(`Chapter ${CH.n} · ${CH.title}`, `الفصل ${CH.n} · ${SI.chTitle(CH)}`);
  const ms = SI.weekEndsIn(), d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5);
  $('#reset').textContent = T(`New week starts in ${d ? d + ' day' + (d > 1 ? 's ' : ' ') : ''}${h} hour${h === 1 ? '' : 's'}. Everyone starts again!`,
    `الأسبوع الجديد يبدأ بعد ${d ? d + ' يوم و' : ''}${h} ساعة. والكل يبدأ من جديد!`);
  const { online, rows } = await SI.LB.top(10);
  const board = $('#board'); board.innerHTML = '';
  if (!rows.length) {
    board.innerHTML = `<li class="empty" style="display:block;border:0">${T('No champions yet this week. Play the Chapter Quest and be the first!', 'لسه مفيش أبطال الأسبوع ده. العب تحدي الفصل وكن الأول!')}</li>`;
  }
  rows.forEach((r, i) => {
    const li = document.createElement('li');
    li.className = (i < 3 ? `top${i + 1}` : '') + (r.id === me.id ? ' me' : '');
    li.innerHTML = `<span class="r">${['🥇', '🥈', '🥉'][i] || i + 1}</span><span class="nm">${SI.esc(r.name)}${r.id === me.id ? `<span class="you">${T('YOU', 'أنت')}</span>` : ''}</span><span class="sc">${r.score}</span>`;
    board.appendChild(li);
  });
  const m = await SI.LB.me();
  const mine = $('#mine');
  if (m) {
    const above = rows[m.rank - 2];
    mine.innerHTML = T(`<div>Your best this week: <b>${m.score}</b><br>Rank <b>#${m.rank}</b></div>`, `<div>أعلى نتيجة ليك الأسبوع ده: <b>${m.score}</b><br>ترتيبك <b>#${m.rank}</b></div>`) +
      (m.rank === 1 ? T('<div>👑 You are number 1!</div>', '<div>👑 إنت رقم ١!</div>') : above ? T(`<div>${above.score - m.score + 1} more points to pass <b>${SI.esc(above.name)}</b>!</div>`, `<div>محتاج ${above.score - m.score + 1} نقطة كمان علشان تعدّي <b>${SI.esc(above.name)}</b>!</div>`) : '');
    mine.hidden = false;
    if (m.rank <= 3) SI.voice('champion');
  }
  $('#note').textContent = online ? T('Showing players from every device.', 'اللاعبين من كل الأجهزة.') : T('Showing players on this device only.', 'اللاعبين على الجهاز ده بس.');
})();
</script>
</body>
</html>
