<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter Quest · Science Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f3d57; --ink:#3a5c75; --card:rgba(255,250,240,.95);
  --primary:#23799f; --primary-d:#1b6182; --mint:#bfe8d6; --mint-d:#8fd3b8;
  --coral:#e2603f; --ok:#2e9e6b; --ok-bg:#d4f4e1; --bad-bg:#fde0d8; --gold:#f2b134;
  --radius:22px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy);
  background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),url(assets/bg_park.jpg) center/cover fixed #d8f1f7;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
.app{max-width:1080px;margin:0 auto;padding:12px 14px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#8fd3ee,#9fdcc4);display:grid;place-items:center;box-shadow:0 4px 12px rgba(31,61,87,.18);font-size:20px}
.brand h1{margin:0;font-size:22px;font-weight:900}
.brand p{margin:0;font-size:13px;font-weight:700;color:var(--ink)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(31,61,87,.12);position:relative;white-space:nowrap}
.pill b{font-size:18px}
.pill.pop{animation:pop .4s}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--navy);font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 3px 10px rgba(31,61,87,.12);display:grid;place-items:center;text-decoration:none}
.icon[aria-pressed="true"]{opacity:.55;text-decoration:line-through}
.float{position:absolute;right:10px;top:-6px;color:var(--ok);font-weight:900;animation:rise 1s forwards;pointer-events:none}

.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:14px;align-items:start}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 8px 28px rgba(31,61,87,.14);padding:16px}

/* question card */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12.5px;font-weight:900;letter-spacing:.3px;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:#e3f1f7;color:var(--primary-d)}
.badge.timed{background:#fff0d9;color:#b45309}
.badge.boss{background:#3a2a5e;color:#ffe08a}
.badge.bonus{background:#fdf2c4;color:#8a6400}
.progress{display:flex;gap:4px;flex-wrap:wrap}
.progress i{width:11px;height:11px;border-radius:50%;background:#dbe9f0}
.progress i.ok{background:var(--ok)}
.progress i.no{background:var(--coral)}
.progress i.now{background:var(--primary);box-shadow:0 0 0 3px #bfe3f2}
.qtext{font-size:23px;font-weight:800;line-height:1.35;margin:6px 0 14px}
.qtext .gap{display:inline-block;min-width:86px;border-bottom:4px solid var(--primary);text-align:center;color:var(--ok);padding:0 6px}
.story{background:#fff;border-left:6px solid #9fdcc4;border-radius:14px;padding:10px 14px}
.timer{height:14px;border-radius:99px;background:#dbe9f0;margin:0 0 12px;overflow:hidden;position:relative}
.timer i{display:block;height:100%;width:100%;background:var(--primary);border-radius:99px}
.timer i.low{background:var(--coral)}
.timer span{position:absolute;right:8px;top:-1px;font-size:11px;font-weight:900;color:#fff}

/* answers */
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.btn{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:16px;padding:12px 18px;min-height:54px;cursor:pointer;
  background:var(--mint);color:var(--navy);box-shadow:0 4px 0 var(--mint-d);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--mint-d)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-d)}
.btn.big{font-size:22px;padding:14px 34px}
.btn:disabled{cursor:default}
.btn:focus-visible{outline:3px solid #f7b267;outline-offset:2px}
.opt{background:#fff;border:3px solid #cfe3ee;box-shadow:none;text-align:left;font-size:18px;display:flex;align-items:center;gap:10px}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:#e3f1f7;display:grid;place-items:center;font-size:15px}
.opt.good{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--coral)}
.opt.dim{opacity:.55}
.opt.sel{border-color:var(--primary);background:#eaf6fb}
.tf .opt{justify-content:center;font-size:22px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols .colhead{font-size:13px;font-weight:900;color:var(--ink);text-transform:uppercase;letter-spacing:.4px}
.opt .num{margin-left:auto;flex:none;min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#fff;background:transparent}
.tools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tools .btn:disabled{opacity:.45;box-shadow:none}
.diagramWrap{display:grid;place-items:center;background:linear-gradient(#eaf7fc,#f6fbf4);border-radius:18px;padding:8px}
.diagram{width:100%;height:auto;max-height:46vh;display:block}
.hot{cursor:pointer}
.hot .ring{fill:rgba(35,121,159,.08);stroke:#23799f;stroke-width:3;stroke-dasharray:7 6}
.hot:hover .ring,.hot:focus .ring{fill:rgba(35,121,159,.2)}
.hot:focus{outline:none}
.hot.sel .ring,.hot.sel .mus{stroke:#23799f;stroke-width:4}
.hot.good .ring{fill:rgba(46,158,107,.28);stroke:var(--ok);stroke-dasharray:none}
.hot.good .mus{fill:#7dd3a8;stroke:var(--ok)}
.hot.bad .ring{fill:rgba(226,96,63,.25);stroke:var(--coral);stroke-dasharray:none}
.hot.bad .mus{fill:#f4a58f;stroke:var(--coral)}
.hot:hover .mus,.hot:focus .mus{filter:brightness(1.08)}
.explain{margin-top:14px;border-radius:16px;padding:12px 14px;font-weight:700;font-size:17px;line-height:1.4}
.explain.ok{background:var(--ok-bg)}
.explain.no{background:var(--bad-bg)}
.actions{margin-top:12px;display:flex;justify-content:flex-end}
.pvbar{display:flex;gap:8px;margin-bottom:12px}
.pvbar select{flex:1 1 0;width:0;min-width:0;text-overflow:ellipsis;font:inherit;font-weight:800;font-size:15px;border:3px solid #cfe3ee;border-radius:14px;padding:8px 10px;background:#fff;color:var(--navy)}
.pvbar .btn{min-height:46px;padding:8px 16px}

/* coach */
.coachRow{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#robot{height:170px;width:auto;transform-origin:50% 100%}
#robot.hop{animation:hop .5s}
.bubble{position:relative;background:#fff;border:3px solid #cfe3ee;border-radius:20px;padding:12px 14px;font-weight:800;font-size:17px;line-height:1.4;width:100%;min-height:70px}
.bubble::before{content:"";position:absolute;left:50%;top:-12px;width:18px;height:18px;margin-left:-9px;background:#fff;border-left:3px solid #cfe3ee;border-top:3px solid #cfe3ee;transform:rotate(45deg)}
.streak{font-weight:900;color:#b45309}

/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(143,211,238,.45);backdrop-filter:blur(4px)}
.panel{background:#fff8ea;border-radius:28px;padding:22px 26px;max-width:480px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(31,61,87,.25)}
.panel h2{margin:6px 0 4px;font-size:32px;font-weight:900}
.panel p{margin:6px 0 14px;font-weight:700;font-size:17px;line-height:1.45}
.panel .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hero{height:160px;width:auto}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.stats span{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px}
.stars{font-size:46px;letter-spacing:6px;color:var(--gold);line-height:1}
.stars .off{color:#e3d9c4}
.banner{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(143,211,238,.4);backdrop-filter:blur(3px);animation:fade .25s;pointer-events:none}
.banner.out{opacity:0;transition:opacity .3s}
.banner div{background:#fff8ea;border-radius:28px;padding:20px 44px;text-align:center;box-shadow:0 14px 40px rgba(31,61,87,.25)}
.banner.boss div{background:#3a2a5e;color:#ffe08a}
.banner small{display:block;font-weight:800;font-size:16px;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.banner strong{font-size:38px;font-weight:900}
.box{font-size:96px;line-height:1;cursor:pointer;background:none;border:0;animation:wobble 1s infinite}
.box:focus-visible{outline:3px solid #f7b267;border-radius:20px}
.prize{font-size:44px;font-weight:900;color:var(--ok);animation:pop .5s}
.confetti{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 2.1s ease-in forwards}

@keyframes pop{50%{transform:scale(1.18)}}
@keyframes rise{to{transform:translateY(-26px);opacity:0}}
@keyframes hop{0%{transform:none}35%{transform:translateY(-14px) scale(.97,1.04)}70%{transform:scale(1.04,.96)}100%{transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg)}}
.shake{animation:shake .4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .coach{order:-1}
  .coachRow{flex-direction:row;text-align:left;align-items:flex-end}
  #robot{height:96px}
  .bubble{font-size:16px;min-height:64px}
  .bubble::before{left:-12px;top:auto;bottom:22px;margin:0;border-top:0;border-bottom:3px solid #cfe3ee}
  html[dir=rtl] .bubble::before{left:auto;right:-12px;border-left:0;border-bottom:0;border-right:3px solid #cfe3ee;border-top:3px solid #cfe3ee}
  .qtext{font-size:20px}
  .brand p{display:none}
  .cols{grid-template-columns:1fr}
}

/* touch screens: a fixed background is unreliable on phones and tablets */
@media (hover:none){body{background-attachment:scroll}}

@media (max-width:820px){
  .app{padding:8px 12px 18px;gap:8px}
  .top{gap:6px}
  .logo{width:34px;height:34px;font-size:17px}
  .brand h1{font-size:19px}
  .hud{gap:6px}
  .pill{padding:6px 11px;font-size:13px}
  .pill b{font-size:16px}
  .icon{width:36px;height:36px;font-size:16px}
  .card{padding:12px}
  #robot{height:64px}
  .bubble{font-size:15px;min-height:0;padding:9px 12px}
  .qtext{font-size:19px;margin:4px 0 10px}
  .opt{font-size:16px;min-height:48px;padding:10px 12px}
  .tf .opt{font-size:19px}
  .opt .k{width:26px;height:26px;font-size:13px}
  .diagram{max-height:40vh}
  .explain{font-size:15.5px;margin-top:10px}
}
@media (max-height:520px) and (orientation:landscape){
  .app{padding:6px 12px 12px;gap:6px}
  .brand p{display:none}
  .grid{grid-template-columns:minmax(0,1.5fr) minmax(0,.5fr);gap:10px}
  .coach{order:0}
  .coachRow{flex-direction:column;text-align:center;align-items:center}
  #robot{height:58px}
  .bubble{font-size:13.5px;min-height:0;padding:8px 10px}
  .bubble::before{display:none}
  .card{padding:10px}
  .qtext{font-size:17px;margin:2px 0 8px}
  .choices{gap:6px}
  .opt{font-size:15px;min-height:40px;padding:7px 10px}
  .diagram{max-height:56vh}
  .btn{min-height:42px}
  .panel{padding:14px 18px}
  .hero{height:90px}
  .panel h2{font-size:24px}
}

@media (max-width:820px){
  .diagram{max-height:max(180px, calc(100vh - 380px));max-height:max(180px, calc(100svh - 380px))}
}

.lvlbox{background:#fff;border-radius:16px;padding:10px 14px;margin:4px 0 10px;text-align:left}
.lvlrow{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:15px;margin-bottom:6px}
.lvlrow span{color:#b7791f}
.lvlbox small{display:block;margin-top:4px;font-weight:800;color:var(--ink);font-size:13px}
.xpbar{height:10px;border-radius:99px;background:#dbe9f0;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f7c948,#f2994a)}
.rank{font-size:18px!important;margin:0 0 8px!important}

/* pop-ups always fit the visible screen (iPhone bars included): the panel scrolls inside itself
   and its buttons stay pinned at the bottom, so they can always be reached */
.overlay{display:flex;align-items:center;justify-content:center;overscroll-behavior:contain;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.panel{max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.panel .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.panel .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:sticky;bottom:-22px;z-index:1;
  margin:0 -26px -22px;padding:14px 26px 22px;background:linear-gradient(rgba(255,248,234,0),#fff8ea 12px)}
.banner div{max-width:calc(100% - 24px)}
@media (max-width:520px){
  .panel{padding:16px;border-radius:24px}
  .banner div{padding:16px 22px}
  .banner strong{font-size:28px}
  .panel .acts{bottom:-16px;margin:0 -16px -16px;padding:12px 16px 16px;gap:8px}
  .panel .acts .btn{flex:1 1 40%}
  .panel .btn{min-height:46px;font-size:16px;padding:9px 12px}
  .panel .btn.big{font-size:19px;padding:10px 18px}
  .panel h2{font-size:26px;margin:4px 0 2px}
  .panel p{font-size:15.5px;margin:4px 0 10px}
  .hero{height:clamp(84px,19vh,150px);height:clamp(84px,19svh,150px)}
  .stars{font-size:38px}
  .stats{gap:6px;margin:6px 0 10px}
  .stats span{font-size:13.5px;padding:5px 11px}
  .box{font-size:76px}
}
@media (max-width:360px){ .panel .btn{font-size:15px;padding:9px 8px} }
@media (max-height:520px) and (orientation:landscape){
  .panel{max-width:620px;padding:12px 18px}
  .panel .acts{bottom:-12px;margin:0 -18px -12px;padding:10px 18px 12px}
  .panel .acts .btn{flex:0 1 auto}
  .hero{height:64px}
  .stars{font-size:30px}
  .stats{margin:4px 0 8px}
  .panel p{font-size:15px;margin:4px 0 8px}
}
</style>
</head>
<body>
<noscript>Please turn on JavaScript to play.</noscript>
<div class="app">
  <header class="top">
    <a class="brand" href="map.html" title="Back to the map" data-ar-label="رجوع للخريطة">
      <div class="logo" aria-hidden="true">🗺️</div>
      <div><h1 id="title">Question Quest</h1><p id="subtitle">Science Island</p></div>
    </a>
    <div class="hud">
      <div class="pill" id="countPill">1 / 12</div>
      <div class="pill" id="scorePill"><span data-ar="النقاط">Score</span> <b id="score">0</b></div>
      <button class="icon" id="mute" type="button" aria-label="Sound" aria-pressed="false" title="Sound on/off" data-ar-label="الصوت">♪</button>
      <a class="icon" href="map.html" aria-label="Back to the map" title="Back to the map" data-ar-label="رجوع للخريطة">⌂</a>
    </div>
  </header>

  <main class="grid">
    <section class="card" id="qcard" aria-live="polite">
      <div class="qhead">
        <div class="badges" id="badges"></div>
        <div class="progress" id="progress" aria-hidden="true"></div>
      </div>
      <div class="timer" id="timer" hidden><i></i><span></span></div>
      <div class="qtext" id="qtext"></div>
      <div id="area"></div>
      <div id="explain" hidden></div>
      <div class="actions" id="actions"></div>
    </section>
    <aside class="card coach">
      <div class="coachRow">
        <img id="robot" src="assets/parrot_wave.png" alt="Reesho the parrot" data-ar-label="البغبغان ريشو">
        <div class="bubble" id="bubble"></div>
      </div>
    </aside>
  </main>
</div>

<script src="firebase-config.js"></script>
<script src="chapters.js"></script>
<script src="common.js"></script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = SI.esc, T = SI.T, AR = SI.isAr();

/* ---------- per-player review schedule (Leitner boxes), sound, mute ---------- */
const CH = SI.chapter() || {};                             // the chapter being played (questions come from CH.questions)
const armSkin = (SI.chProf('ch1').game || {}).skin || 0;   // arm colour chosen in Arm Mechanic, used by the arm diagrams
const DAY = 864e5, INTERVALS = [0, 1, 3, 7, 14];
function recordCard(id, firstTry) {
  SI.updateChProf(p => {
    p.cards = p.cards || {};
    const c = p.cards[id] || { box: 0 };
    c.seen = (c.seen || 0) + 1;
    if (firstTry) { c.box = Math.min(c.box + 1, 4); c.due = Date.now() + INTERVALS[c.box] * DAY; }
    else { c.box = 0; c.due = Date.now(); }               // wrong or needed help: back in today's review
    p.cards[id] = c;
  });
}
function dueCards() {
  const cards = SI.chProf().cards || {}, now = Date.now();
  return Object.entries(cards).filter(([, c]) => c.due <= now).sort((a, b) => a[1].box - b[1].box || a[1].due - b[1].due).map(([id]) => id);
}
const sfx = SI.sfx;
const muteBtn = $('#mute');
const paintMute = () => { const m = SI.isMuted(); muteBtn.setAttribute('aria-pressed', m); muteBtn.setAttribute('aria-label', m ? T('Sound off', 'الصوت مغلق') : T('Sound on', 'الصوت شغال')); };
muteBtn.onclick = () => { SI.setMuted(!SI.isMuted()); paintMute(); };
paintMute();

/* ---------- coach + fx ---------- */
const robot = $('#robot'), bubble = $('#bubble');
function say(html, p) {
  bubble.innerHTML = html;
  if (p) { robot.src = `assets/parrot_${p}.png`; robot.classList.remove('hop'); void robot.offsetWidth; robot.classList.add('hop'); }
}
function confetti(n = 30) {
  if (reduceMotion) return;
  const colors = ['#f08a6c', '#8fd3ee', '#9fdcc4', '#f7d58a', '#c7a7e0'];
  for (let i = 0; i < n; i++) {
    const c = mk('i', 'confetti'); c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.animationDelay = Math.random() * .4 + 's'; c.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
    document.body.appendChild(c); setTimeout(() => c.remove(), 2800);
  }
}
async function banner(a, b, cls = '') {
  const e = mk('div', 'banner ' + cls, `<div><small>${a}</small><strong>${b}</strong></div>`);
  document.body.appendChild(e); await sleep(reduceMotion ? 900 : 1500); e.classList.add('out'); await sleep(320); e.remove();
}
let score = 0;
function addScore(n) {
  if (!n) return;
  score += n; $('#score').textContent = score;
  const p = $('#scorePill'); p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop');
  const f = mk('span', 'float', '+' + n); p.appendChild(f); setTimeout(() => f.remove(), 1000);
}
function nextBtn(label = T('Next ▸', 'التالي ◂')) {
  return new Promise(res => {
    const a = $('#actions'); a.innerHTML = '';
    const b = mk('button', 'btn primary', label); b.type = 'button';
    b.onclick = () => { a.innerHTML = ''; sfx.tick(); res(); };
    a.appendChild(b); b.focus({ preventScroll: true });

  if (q.mode === 'timed') b.appendChild(mk('span', 'badge timed', `⏱ ${q.seconds}${T('s', ' ث')}`));

function startTimer(sec, onEnd) {
  const t = $('#timer'), bar = t.firstElementChild, lab = t.lastElementChild;
  t.hidden = false; bar.style.width = '100%'; bar.classList.remove('low');
  const t0 = performance.now(); let lastSec = sec, done = false;
  const iv = setInterval(() => {
    const left = 1 - (performance.now() - t0) / (sec * 1000);
    bar.style.width = Math.max(0, left * 100) + '%'; bar.classList.toggle('low', left < .3);
    const s = Math.ceil(Math.max(0, left) * sec); lab.textContent = s + T('s', ' ث');
    if (s < lastSec && s <= 3 && s > 0) sfx.beep(); lastSec = s;
    if (left <= 0) stop(true);
  }, 50);
  function stop(timeout) {
    if (done) return 0; done = true; clearInterval(iv);
    const left = Math.max(0, 1 - (performance.now() - t0) / (sec * 1000));
    if (timeout) onEnd();
    return left;
  }
  timerStop = () => stop(false);
  return stop;
}
function hideTimer() { $('#timer').hidden = true; timerStop = null; }

/* each renderer resolves {firstTry, correct, timeout} */
function ask(q) {
  return new Promise(resolve => {
    const area = $('#area'); area.innerHTML = '';
    const qt = $('#qtext'); qt.className = 'qtext' + (q.style === 'story' ? ' story' : '');
    qt.innerHTML = q.type === 'fill' ? esc(q.q).replace('___', '<span class="gap" id="gap">&nbsp;</span>') : esc(q.q);
    const ex = $('#explain'); ex.hidden = true; ex.className = 'explain';
    const timed = q.mode === 'timed';
    let finished = false, tries = 0, stopTimer = null;
    const finish = (correct, firstTry, timeout = false) => {
      if (finished) return; finished = true;
      const left = stopTimer ? stopTimer() : 0;
      resolve({ correct, firstTry, timeout, left });
    };
    if (timed) stopTimer = startTimer(q.seconds, () => { if (!finished) { reveal(); finished = true; resolve({ correct: false, firstTry: false, timeout: true, left: 0 }); } });
    else hideTimer();

    let reveal = () => {};
    const optBtn = (html, key) => { const b = mk('button', 'btn opt', (key ? `<span class="k">${key}</span>` : '') + `<span>${html}</span>`); b.type = 'button'; return b; };

    if (q.type === 'mc' || q.type === 'fill' || q.type === 'tf') {
      const opts = q.type === 'tf' ? [T('True', 'صح'), T('False', 'خطأ')] : q.options;
      const order = q.type === 'tf' ? [0, 1] : shuffle(opts.map((_, i) => i));
      const wrap = mk('div', 'choices' + (q.type === 'tf' ? ' two tf' : q.type === 'fill' ? ' two' : ''));
      const maxTries = (!timed && q.type === 'mc' && opts.length > 2) ? 2 : 1;
      const btns = order.map((oi, k) => {
        const b = optBtn(q.type === 'tf' ? (oi === 0 ? T('✓ True', '✓ صح') : T('✗ False', '✗ خطأ')) : esc(opts[oi]), q.type === 'tf' ? '' : T('ABCD', 'أبجد')[k]);
        b.dataset.oi = oi;
        b.onclick = () => {
          if (finished) return;
          tries++;
          if (oi === q.answer) {
            b.classList.add('good'); btns.forEach(x => x.disabled = true);
            if (q.type === 'fill') $('#gap').textContent = opts[oi];
            finish(true, tries === 1);
          } else {
            b.classList.add('bad'); b.disabled = true; sfx.bad();
            if (tries >= maxTries) { reveal(); finish(false, false); }
            else say(T('Not quite. Try once more!', 'قرّبت! جرّب مرة كمان.'), 'think');
          }
        };
        wrap.appendChild(b); return b;
      });
      reveal = () => {
        btns.forEach(x => { x.disabled = true; if (+x.dataset.oi === q.answer) x.classList.add('good'); else if (!x.classList.contains('bad')) x.classList.add('dim'); });
        if (q.type === 'fill') $('#gap').textContent = opts[q.answer];
      };
      area.appendChild(wrap);
    }

    else if (q.type === 'order') {
      const picked = [];
      const wrap = mk('div', 'choices');
      const view = shuffle(q.items.map((_, i) => i));
      const btns = view.map(ii => {
        const b = optBtn(esc(q.items[ii]) + '</span><span class="num">'); b.dataset.ii = ii;
        b.onclick = () => {
          if (finished || picked.includes(ii)) return;
          picked.push(ii); sfx.tick(); paint();
          if (picked.length === q.items.length) check.disabled = false;
        };
        wrap.appendChild(b); return b;
      });
      const paint = () => btns.forEach(b => {
        const pos = picked.indexOf(+b.dataset.ii), num = b.querySelector('.num');
        num.textContent = pos >= 0 ? pos + 1 : ''; num.style.background = pos >= 0 ? 'var(--primary)' : 'transparent';
        b.classList.toggle('sel', pos >= 0);
        undo.disabled = !picked.length;
      });
      const tools = mk('div', 'tools');
      const undo = mk('button', 'btn', T('↺ Start over', '↺ ابدأ من جديد')); undo.type = 'button'; undo.disabled = true;
      const check = mk('button', 'btn primary', T('Check ✓', 'تحقق ✓')); check.type = 'button'; check.disabled = true;
      undo.onclick = () => { if (!finished) { picked.length = 0; check.disabled = true; paint(); } };
      check.onclick = () => {
        if (finished) return;
        const ok = picked.every((v, i) => v === q.answer[i]);
        btns.forEach(b => { const pos = picked.indexOf(+b.dataset.ii); b.classList.remove('sel'); b.classList.add(q.answer[pos] === +b.dataset.ii ? 'good' : 'bad'); b.disabled = true; });
        undo.disabled = check.disabled = true; tools.hidden = true;
        if (!ok) reveal();
        finish(ok, ok);
      };
      reveal = () => {
        undo.disabled = check.disabled = true; tools.hidden = true; btns.forEach(b => b.disabled = true);
        const right = mk('div', 'explain no', T('<b>Right order:</b> ', '<b>الترتيب الصحيح:</b> ') + q.answer.map((ii, k) => `${k + 1}. ${esc(q.items[ii])}`).join(T(' &nbsp;→&nbsp; ', ' &nbsp;←&nbsp; ')));
        area.appendChild(right);
      };
      tools.append(undo, check);
      area.append(wrap, tools);
    }

    else if (q.type === 'match') {
      const COLORS = ['#23799f', '#c2410c', '#7c3aed', '#0f766e'];
      const pairs = {}; let selLeft = null;
      const cols = mk('div', 'cols');
      const lc = mk('div', 'choices'), rc = mk('div', 'choices');
      lc.appendChild(mk('div', 'colhead', T('Tap one here…', 'اضغط على واحدة هنا…'))); rc.appendChild(mk('div', 'colhead', T('…then its partner here', '…وبعدين على ما يناسبها هنا')));
      const lb = q.left.map((t, i) => { const b = optBtn(esc(t) + '</span><span class="num">'); b.dataset.li = i; b.onclick = () => { if (finished) return; selLeft = i; sfx.tick(); paint(); }; lc.appendChild(b); return b; });
      const rview = shuffle(q.right.map((_, i) => i));
      const rb = {};
      rview.forEach(ri => {
        const b = optBtn(esc(q.right[ri]) + '</span><span class="num">'); b.dataset.ri = ri;
        b.onclick = () => {
          if (finished || selLeft === null) { if (selLeft === null && !finished) say(T('First tap an item on the left.', 'اضغط الأول على كلمة من العمود الأول.'), 'point'); return; }
          for (const k in pairs) if (pairs[k] === ri) delete pairs[k];
          pairs[selLeft] = ri; selLeft = null; sfx.tick(); paint();
          check.disabled = Object.keys(pairs).length !== q.left.length;
        };
        rc.appendChild(b); rb[ri] = b;
      });
      const paint = () => {
        lb.forEach((b, i) => { const has = i in pairs; const num = b.querySelector('.num'); num.textContent = has ? i + 1 : ''; num.style.background = has ? COLORS[i] : 'transparent'; b.classList.toggle('sel', selLeft === i); });
        Object.values(rb).forEach(b => { const num = b.querySelector('.num'); num.textContent = ''; num.style.background = 'transparent'; });
        for (const k in pairs) { const num = rb[pairs[k]].querySelector('.num'); num.textContent = +k + 1; num.style.background = COLORS[k]; }
      };
      const tools = mk('div', 'tools');
      const check = mk('button', 'btn primary', T('Check ✓', 'تحقق ✓')); check.type = 'button'; check.disabled = true;
      check.onclick = () => {
        if (finished) return;
        let ok = true; lb.forEach(b => b.classList.remove('sel'));
        q.left.forEach((_, i) => { const good = pairs[i] === q.answer[i]; ok = ok && good; lb[i].classList.add(good ? 'good' : 'bad'); rb[pairs[i]].classList.add(good ? 'good' : 'bad'); });
        tools.hidden = true;
        if (!ok) reveal(); else { check.disabled = true; [...lb, ...Object.values(rb)].forEach(b => b.disabled = true); }
        finish(ok, ok);
      };
      reveal = () => {
        check.disabled = true; tools.hidden = true; [...lb, ...Object.values(rb)].forEach(b => b.disabled = true);
        area.appendChild(mk('div', 'explain no', T('<b>Right pairs:</b> ', '<b>التوصيل الصحيح:</b> ') + q.left.map((t, i) => `${esc(t)} ${T('→', '←')} ${esc(q.right[q.answer[i]])}`).join(' &nbsp;·&nbsp; ')));
      };
      cols.append(lc, rc); tools.appendChild(check);
      area.append(cols, tools);
    }

    else if (q.type === 'tap') {
      const wrap = mk('div', 'diagramWrap', DIAGRAMS[q.diagram]());
      area.appendChild(wrap);
      const hots = [...wrap.querySelectorAll('.hot')];
      const pick = h => {
        if (finished) return;
        const ok = h.dataset.id === q.answer;
        h.classList.add(ok ? 'good' : 'bad');
        if (!ok) reveal(); else hots.forEach(x => x.setAttribute('tabindex', '-1'));
        finish(ok, ok);
      };
      hots.forEach(h => {
        h.addEventListener('click', () => pick(h));
        h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(h); } });
      });
      reveal = () => hots.forEach(x => { if (x.dataset.id === q.answer) x.classList.add('good'); x.setAttribute('tabindex', '-1'); });
    }
  });
}

/* ---------- session ---------- */
const PRAISE = AR ? ['شغل عظيم!', 'ممتاز!', 'صح عليك!', 'رائع!', 'أحسنت!', 'برافو!', 'جامد!'] : ['Great job!', 'Super!', 'You got it!', 'Brilliant!', 'Well done!', 'Fantastic!', 'Awesome!'];
let streak = 0, best = 0;

async function mysteryBox() {
  return new Promise(res => {
    const prize = [20, 30, 30, 50][Math.floor(Math.random() * 4)];
    const o = mk('div', 'overlay', `<div class="panel">
      <h2>${T('Mystery box!', 'صندوق المفاجآت!')}</h2><p>${T('5 right answers in a row. Tap the box!', '٥ إجابات صح ورا بعض. اضغط على الصندوق!')}</p>
      <button class="box" type="button" aria-label="${T('Open the mystery box', 'افتح صندوق المفاجآت')}">🎁</button>
      <div class="prize" hidden>+${prize}</div>
      <div class="row acts"><button class="btn primary" type="button" hidden>${T('Keep going ▸', 'كمّل ◂')}</button></div></div>`);
    document.body.appendChild(o);
    const box = $('.box', o), go = $('.btn', o), pr = $('.prize', o);
    box.focus();
    box.onclick = () => {
      if (box.dataset.done) return; box.dataset.done = 1;
      box.textContent = '✨'; box.style.animation = 'none'; pr.hidden = false; go.hidden = false;
      sfx.win(); SI.voice('box'); confetti(40); addScore(prize); say(T(`Wow! You won <b>${prize}</b> bonus points!`, `واو! كسبت <b>${prize}</b> نقطة زيادة!`), 'celebrate');
      go.focus();
    };
    go.onclick = () => { o.remove(); res(); };
  });
}

/* one phrasing per idea, a different one from last time when possible */
function variantOf(idea) {
  const last = (SI.chProf().lastVar || {})[idea.id];
  let pool = idea.variants.map((_, i) => i);
  if (pool.length > 1) pool = pool.filter(i => i !== last);
  const vi = pool[Math.floor(Math.random() * pool.length)], v = idea.variants[vi];
  return Object.assign({ id: idea.id, lesson: idea.lesson, concept: idea.concept, explain: idea.explain, vi }, idea.bonus ? { src: 'bonus' } : {}, v, v.explain ? { explain: v.explain } : {});
}
function rememberVariants(list) { SI.updateChProf(p => { p.lastVar = p.lastVar || {}; list.forEach(q => { p.lastVar[q.id] = q.vi; }); }); }
const ideaById = id => window.IDEAS.find(I => I.id === id);

async function playList(list, label) {
  const results = [], missed = [];
  let firstRight = 0;
  for (let i = 0; i < list.length; i++) {
    const q = list[i];
    if (q.src === 'bonus' && list[i - 1] && list[i - 1].src !== 'bonus') {
      sfx.boss(); await banner(T('Bonus', 'إضافي'), T('Extra question!', 'سؤال إضافي!'));
      say(T('A bonus question from the chapter’s extra reading. Extra points!', 'سؤال إضافي من الجزء الإثرائي في الكتاب. نقط زيادة!'), 'point');
    } else if (q.mode === 'boss' && list[i - 1] && list[i - 1].mode !== 'boss') {
      sfx.boss(); SI.voice('boss'); await banner(T('Get ready', 'استعد'), T('Boss Round!', 'التحدي الكبير!'), 'boss');
      say(T('Boss questions mix two ideas. Take your time!', 'أسئلة التحدي الكبير بتجمع فكرتين. خد وقتك!'), 'point');
    } else if (i === 0) {
      say(label === 'review' ? T('Let’s practise the tricky ones again!', 'يلّا نراجع الأسئلة الصعبة تاني!') : label === 'daily' ? T('Five quick ones. Let’s go!', 'خمسة سريعين. يلّا بينا!') : T('Read carefully and have fun!', 'اقرأ كويس واستمتع!'), 'point');
    } else {
      say(q.mode === 'timed' ? T('Quick one! Watch the timer.', 'سؤال سريع! خلّي بالك من الوقت.') : q.style === 'story' ? T('Read the story first.', 'اقرأ القصة الأول.') : T('You can do it!', 'إنت تقدر!'), 'think');
    }
    header(q, i, list.length, results);
    window.__cur = q;
    const r = await ask(q);
    hideTimer();
    if (label !== 'retry') recordCard(q.id, r.firstTry);
    results[i] = r.firstTry;
    const ex = $('#explain');
    if (r.correct) {
      if (r.firstTry) { streak++; if (q.src !== 'bonus' || label !== 'quest') firstRight++; } else streak = 0;
      best = Math.max(best, streak);
      let pts = label === 'retry' ? 5 : r.firstTry ? PTS[q.level] + (q.mode === 'boss' ? 5 : 0) : 5;
      let extra = '';
      if (q.mode === 'timed' && r.firstTry) { const sp = Math.round(r.left * 10); pts += sp; if (sp) extra += ` ⚡ +${sp} ${T('speed', 'سرعة')}`; }
      if (streak >= 3 && r.firstTry) { pts += 5; extra += ` <span class="streak">🔥 ×${streak}</span>`; }
      addScore(pts); sfx.ok(); SI.voice(streak >= 3 && streak % 3 === 0 ? 'streak' : 'ok');
      confetti(q.mode === 'boss' ? 40 : 14);
      say(`${PRAISE[Math.floor(Math.random() * PRAISE.length)]}${extra}`, q.mode === 'boss' ? 'celebrate' : 'thumbs');
      ex.className = 'explain ok'; ex.innerHTML = `✓ ${esc(q.explain)}`; ex.hidden = false;
    } else {
      streak = 0; sfx.bad(); SI.voice('bad'); if (q.src !== 'bonus' || label !== 'quest') missed.push(q);
      say(r.timeout ? T('Time’s up! Here is the answer.', 'الوقت خلص! دي الإجابة.') : T('Good try! Look at the right answer.', 'محاولة حلوة! بص على الإجابة الصح.'), 'sad');
      ex.className = 'explain no'; ex.innerHTML = `${r.timeout ? T('⏱ Time’s up. ', '⏱ الوقت خلص. ') : ''}${esc(q.explain)}`; ex.hidden = false;
      const card = $('#qcard'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    }
    header(q, i, list.length, results);
    await nextBtn(i === list.length - 1 ? T('Finish ▸', 'إنهاء ◂') : T('Next ▸', 'التالي ◂'));
    if (r.firstTry && streak > 0 && streak % 5 === 0) await mysteryBox();
  }
  return { results, missed, firstRight };
}

/* Chapter Quest: 20 ideas, one phrasing each; normal and timed mixed, Boss ideas last */
function buildQuest() {
  const normal = [], timed = [], boss = [];
  const bonus = window.IDEAS.filter(I => I.bonus);
  window.IDEAS.filter(I => !I.bonus).forEach(I => {
    const q = variantOf(I);
    if (I.boss) { q.mode = 'boss'; boss.push(q); } else (q.mode === 'timed' ? timed : normal).push(q);
  });
  const N = shuffle(normal), T = shuffle(timed), seq = [];
  while (N.length || T.length) {
    if (N.length) seq.push(N.shift());
    if (T.length) seq.push(T.shift());
    if (N.length && T.length < N.length) seq.push(N.shift());
  }
  const extra = bonus.length ? [Object.assign(variantOf(bonus[Math.floor(Math.random() * bonus.length)]), { mode: 'normal' })] : [];
  return seq.concat(shuffle(boss), extra);   // one bonus question after the Boss round; it never counts for the stars
}
/* Daily 5: ideas due for review first, then the ones the player knows least */
function buildDaily() {
  const cards = SI.chProf().cards || {}, due = dueCards();
  const box = id => (cards[id] ? cards[id].box : -1);
  const rest = shuffle(window.IDEAS.filter(I => !I.bonus).map(I => I.id).filter(id => !due.includes(id))).sort((a, b) => box(a) - box(b));
  return due.concat(rest).slice(0, 5).map(id => { const q = variantOf(ideaById(id)); if (q.mode === 'boss') q.mode = 'normal'; return q; });
}
function buildReview() {
  return dueCards().slice(0, 10).map(ideaById).filter(Boolean).map(I => { const q = variantOf(I); if (q.mode === 'boss') q.mode = 'normal'; return q; });
}

function levelBlock(gain) {
  const L = gain.after;
  return `<div class="lvlbox"><div class="lvlrow"><b>${T('Level', 'المستوى')} ${L.n} · ${L.title}</b><span>+${gain.gained} XP</span></div>
    <div class="xpbar"><i style="width:${Math.round(L.pct * 100)}%"></i></div>
    <small>${L.to ? T(`${L.to - L.xp} XP to ${L.next}`, `باقي ${L.to - L.xp} XP للوصول إلى ${L.next}`) : T('Top level reached!', 'وصلت لأعلى مستوى!')}</small></div>`;
}

async function results(kind, res, total, extraXP = 0) {
  const acc = total ? res.firstRight / total : 0;
  const stars = acc >= .9 ? 3 : acc >= .7 ? 2 : acc > 0 ? 1 : 0;
  let bestScore = score;
  if (kind === 'quest') {
    SI.updateChProf(p => { const Q = p.quest = p.quest || {}; Q.best = Math.max(Q.best || 0, score); Q.stars = Math.max(Q.stars || 0, stars); Q.plays = (Q.plays || 0) + 1; bestScore = Q.best; });
  }
  const gain = SI.addXP(score + extraXP);
  const levelUp = gain.after.n > gain.before.n;
  sfx.win(); confetti(60); SI.voice('finish');
  const me = SI.player();
  say(stars === 3 ? T(`Amazing, ${esc(me.name)}! You are a real expert on ${esc(CH.title)}!`, `مذهل يا ${esc(me.name)}! إنت خبير حقيقي في ${esc(SI.chTitle(CH))}!`) : T(`Nice work, ${esc(me.name)}! Play again to get more stars.`, `شغل حلو يا ${esc(me.name)}! العب تاني علشان تاخد نجوم أكتر.`), 'celebrate');
  const titles = AR ? { quest: 'خلّصت التحدي!', daily: 'خلّصت خماسية اليوم!', review: 'خلّصت المراجعة!' } : { quest: 'Quest complete!', daily: 'Daily 5 done!', review: 'Review done!' };
  const o = mk('div', 'overlay', `<div class="panel">
    <img class="hero" src="assets/parrot_${stars >= 2 ? 'celebrate' : 'thumbs'}.png" alt="">
    <h2>${titles[kind]}</h2>
    ${kind === 'quest' ? `<div class="stars" aria-label="${T(`${stars} of 3 stars`, `${stars} من ٣ نجوم`)}">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div>` : ''}
    <div class="stats"><span>${T('Score', 'النقاط')}: ${score}</span><span>${T('Right first time', 'صح من أول مرة')}: ${res.firstRight} / ${total}</span>${kind === 'quest' ? `<span>${T('Best', 'أعلى نتيجة')}: ${bestScore}</span>` : ''}${extraXP ? `<span>🔥 ${T('Daily bonus', 'مكافأة اليوم')} +${extraXP}</span>` : ''}</div>
    ${levelBlock(gain)}
    ${kind === 'quest' ? `<p class="rank" id="rank">${T('Saving your score…', 'بنحفظ نتيجتك…')}</p>` : ''}
    <p>${res.missed.length ? T(`Reesho saved <b>${res.missed.length}</b> tricky question${res.missed.length > 1 ? 's' : ''} for your review.`, `ريشو حفظ لك <b>${res.missed.length}</b> سؤال صعب علشان تراجعه.`) : T('Perfect! Come back tomorrow for your Daily 5.', 'ممتاز! ارجع بكرة لخماسية اليوم.')}</p>
    <div class="row acts">
      ${res.missed.length ? `<a class="btn primary" href="quiz.html#review">${T('Review now', 'راجع دلوقتي')}</a>` : ''}
      ${kind === 'quest' ? `<a class="btn" href="champions.html">🏆 ${T('Champions', 'الأبطال')}</a>` : ''}
      <a class="btn" href="map.html">${T('Map', 'الخريطة')}</a>
      <button class="btn" type="button" id="again">${T('Play again', 'العب تاني')}</button>
    </div></div>`);
  document.body.appendChild(o);
  SI.rate.guard(o, 'a[href="map.html"], a[href="champions.html"]', 'results');   // Reesho asks for a rating before the player leaves (once per chapter)
  $('#again', o).onclick = () => location.reload();
  if (levelUp) { setTimeout(() => { sfx.level(); SI.voice('level'); banner(T('Level up!', 'مستوى جديد!'), `${T('Level', 'المستوى')} ${gain.after.n} · ${gain.after.title}`); }, 900); }
  if (kind === 'quest') {
    try {
      await SI.LB.submit(score);
      const m = await SI.LB.me();
      $('#rank', o).innerHTML = m ? T(`🏆 You are <b>#${m.rank}</b> this week${m.online ? '' : ' on this device'}!`, `🏆 ترتيبك <b>#${m.rank}</b> الأسبوع ده${m.online ? '' : ' على الجهاز ده'}!`) : '';
    } catch (e) { $('#rank', o).textContent = ''; }
  }
}

function intro(title, sub, text, startLabel = T('Start', 'ابدأ')) {
  return new Promise(res => {
    const o = mk('div', 'overlay', `<div class="panel">
      <img class="hero" src="assets/parrot_wave.png" alt="">
      <h2>${title}</h2><p><b>${sub}</b><br>${text}</p>
      <div class="row acts"><button class="btn primary big" type="button" id="start">${startLabel}</button></div></div>`);
    document.body.appendChild(o);
    const b = $('#start', o); b.focus();
    b.onclick = () => { sfx.tick(); o.remove(); res(); };
  });
}
function notice(title, text, buttons) {
  const o = mk('div', 'overlay', `<div class="panel"><img class="hero" src="assets/parrot_thumbs.png" alt="">
    <h2>${title}</h2><p>${text}</p><div class="row acts">${buttons}</div></div>`);
  document.body.appendChild(o);
  return o;
}

/* Preview (for the owner): quiz.html#preview shows every phrasing of every question, one by one.
   No score, no XP, nothing saved. quiz.html#preview=B6.2 opens that phrasing directly. */
async function preview(set) {
  set(T('Preview', 'معاينة'), T('All questions · nothing is saved', 'كل الأسئلة · مفيش حاجة بتتسجل'));
  const all = [];
  window.IDEAS.forEach(I => I.variants.forEach((v, vi) => all.push(Object.assign({ id: I.id, lesson: I.lesson, concept: I.concept, explain: I.explain, vi }, I.bonus ? { src: 'bonus' } : {}, I.boss ? { boss: true } : {}, v, v.explain ? { explain: v.explain } : {}))));
  const bar = mk('div', 'pvbar');
  const prev = mk('button', 'btn', T('‹', '›')), next = mk('button', 'btn', T('›', '‹')), sel = mk('select');
  prev.type = next.type = 'button'; sel.setAttribute('aria-label', T('Question', 'السؤال'));
  all.forEach((q, i) => { const o = mk('option'); o.value = i; o.textContent = `${q.id}.${q.vi + 1} · ${TYPE_LABEL[q.style] || TYPE_LABEL[q.type]} · ${q.concept}${q.src === 'bonus' ? ' ★' : ''}`; sel.appendChild(o); });
  bar.append(prev, sel, next); $('#qcard').prepend(bar);
  let k = 0, token = 0;
  const m = /^#preview=([A-Z]\d+)\.(\d+)$/.exec(location.hash);
  if (m) { const f = all.findIndex(q => q.id === m[1] && q.vi === +m[2] - 1); if (f >= 0) k = f; }
  async function show(i) {
    k = (i + all.length) % all.length; sel.value = k; const run = ++token, q = all[k];
    if (timerStop) timerStop(); hideTimer(); $('#actions').innerHTML = '';
    history.replaceState(null, '', `#preview=${q.id}.${q.vi + 1}`);
    header(q, 0, 0, []); $('#countPill').textContent = `${k + 1} / ${all.length}`;
    say(`<b>${q.id}.${q.vi + 1}</b> · ${esc(q.concept)}`, 'point');
    const r = await ask(q);
    if (run !== token) return;
    hideTimer();
    const ex = $('#explain'); ex.className = 'explain ' + (r.correct ? 'ok' : 'no'); ex.innerHTML = (r.correct ? '✓ ' : '') + esc(q.explain); ex.hidden = false;
    say(r.correct ? T('Right!', 'صح!') : T('Wrong answer shown.', 'دي الإجابة الصح.'), r.correct ? 'thumbs' : 'sad');
  }
  prev.onclick = () => show(k - 1); next.onclick = () => show(k + 1); sel.onchange = () => show(+sel.value);
  show(k);
}

async function main() {
  const me = SI.player();
  const mode = /^#(daily|review)$/.test(location.hash) ? location.hash.slice(1) : /^#preview/.test(location.hash) ? 'preview' : 'quest';
  say(T(`Hi, ${esc(me.name)}! I’m Reesho.`, `أهلًا يا ${esc(me.name)}! أنا ريشو.`), 'wave');
  const set = (t, s) => { $('#title').textContent = t; $('#subtitle').textContent = s; document.title = t + T(' · Science Island', ' · جزيرة العلوم'); };
  const TITLE = SI.chTitle(CH);

  if (mode === 'preview') return preview(set);
  if (mode === 'quest') {
    const N = window.IDEAS.filter(I => !I.bonus).length;
    set(T('Chapter Quest', 'تحدي الفصل'), T(`${CH.title} · ${N} questions`, `${TITLE} · ${N} سؤال`));
    const list = buildQuest(); rememberVariants(list);
    await intro(T(`Ready, ${esc(me.name)}?`, `جاهز يا ${esc(me.name)}؟`), T(`Chapter ${CH.n} Quest · ${N} questions`, `تحدي الفصل ${CH.n} · ${N} سؤال`),
      T('Some questions have a timer ⏱. The last ones are Boss questions ★. Get 5 right in a row for a mystery box 🎁. Your best score goes on the Champions board 🏆!',
        'بعض الأسئلة ليها وقت ⏱. وآخر الأسئلة هي التحدي الكبير ★. جاوب ٥ صح ورا بعض وخد صندوق المفاجآت 🎁. وأعلى نتيجة ليك بتدخل لوحة الأبطال 🏆!'));
    const res = await playList(list, 'quest');
    const retry = res.missed.filter(q => q.mode !== 'boss');
    if (retry.length) {
      await banner(T('Second chance', 'فرصة تانية'), T('Try them again!', 'جرّبهم تاني!'));
      await playList(retry.map(q => Object.assign({}, q, { mode: 'normal' })), 'retry');
    }
    await results('quest', res, list.filter(q => q.src !== 'bonus').length);
  } else if (mode === 'daily') {
    set(T('Daily 5', 'خماسية اليوم'), T(`${CH.title} · five quick questions every day`, `${TITLE} · خمس أسئلة سريعة كل يوم`));
    const st = SI.dailyState();
    if (st.done) {
      const o = notice(T('Done for today!', 'خلّصت النهارده!'), T(`You already did today’s Daily 5. 🔥 Your streak: <b>${st.streak} day${st.streak === 1 ? '' : 's'}</b>. Come back tomorrow!`, `إنت حليت خماسية النهارده خلاص. 🔥 سلسلتك: <b>${st.streak} يوم</b>. ارجع بكرة!`),
        `<button class="btn primary" type="button" id="practise">${T('Practise anyway', 'اتمرّن برضه')}</button><a class="btn" href="map.html">${T('Map', 'الخريطة')}</a>`);
      await new Promise(r => { $('#practise', o).onclick = () => { o.remove(); r(); }; });
      const list = buildDaily(); rememberVariants(list);
      const res = await playList(list, 'daily');
      return results('daily', res, list.length);
    }
    const list = buildDaily(); rememberVariants(list);
    await intro(T('Daily 5', 'خماسية اليوم'), st.streak ? T(`🔥 ${st.streak} day streak`, `🔥 ${st.streak} يوم ورا بعض`) : T('Start your streak today!', 'ابدأ سلسلتك النهارده!'), T('Five quick questions. Finish them to keep your fire streak going and win bonus XP.', 'خمس أسئلة سريعة. خلّصهم علشان تحافظ على سلسلتك وتكسب XP زيادة.'), T('Go!', 'يلّا!'));
    const res = await playList(list, 'daily');
    const streakNow = SI.completeDaily();
    await results('daily', res, list.length, 20 + Math.min(streakNow, 10) * 5);
  } else {
    set(T('Review', 'المراجعة'), T(`${CH.title} · the tricky ones`, `${TITLE} · الأسئلة الصعبة`));
    const list = buildReview();
    if (!list.length) {
      const cards = SI.chProf().cards || {};
      const next = Object.values(cards).map(c => c.due).sort((a, b) => a - b)[0];
      const when = next ? Math.max(1, Math.round((next - Date.now()) / DAY)) : 0;
      notice(T('All caught up!', 'مفيش حاجة متأخرة!'), next ? T(`Nothing to review right now. Come back in about <b>${when} day${when > 1 ? 's' : ''}</b>.`, `مفيش مراجعة دلوقتي. ارجع بعد حوالي <b>${when} يوم</b>.`) : T('Play the Chapter Quest first. Reesho will save the tricky questions here.', 'العب تحدي الفصل الأول، وريشو هيحفظ لك الأسئلة الصعبة هنا.'),
        `<a class="btn primary" href="map.html">${T('Map', 'الخريطة')}</a>`);
      return;
    }
    rememberVariants(list);
    await intro(T('Review time', 'وقت المراجعة'), T(`${list.length} question${list.length > 1 ? 's' : ''} to practise`, `${list.length} سؤال للتمرين`), T('These were tricky before. Get them right to move them further away!', 'الأسئلة دي كانت صعبة عليك قبل كده. جاوبها صح علشان تبعد عنك!'), T('Go!', 'يلّا!'));
    const res = await playList(list, 'review');
    await results('review', res, list.length);
  }
}
window.addEventListener('hashchange', () => location.reload());
if (SI.requirePlayer() && SI.requireChapter()) {
  SI.applyTheme();
  if (CH.quizBg) document.body.style.backgroundImage = `linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),url(${CH.quizBg})`;
  SI.loadQuestions().then(main).catch(e => {
    console.error(e);
    notice(T('Not ready yet', 'لسه مش جاهز'), T('The questions for this chapter could not be loaded. Check your connection and try again.', 'مقدرناش نحمّل أسئلة الفصل. اتأكد من النت وجرّب تاني.'), `<a class="btn primary" href="chapters.html">${T('Chapters', 'الفصول')}</a><button class="btn" type="button" onclick="location.reload()">${T('Try again', 'جرّب تاني')}</button>`);
  });
}
window.__quiz = { ask: q => ask(q), DIAGRAMS, variantOf, mysteryBox, notice, results: (kind, res, total, extra, sc) => { if (sc != null) score = sc; return results(kind, res, total, extra); } };
})();
</script>
