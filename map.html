<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Island · Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css?v=20261010c">
<style>
.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.mapWrap{position:relative;width:100%;max-width:min(680px, calc((100vh - 120px) * 1224 / 1285));margin:0 auto;aspect-ratio:1224/1285;border-radius:26px;
  box-shadow:0 10px 34px rgba(31,61,87,.22);background:linear-gradient(#bfe8f6,#8fd3ee) center/cover #8fd3ee;container-type:inline-size}
.stop{position:absolute;transform:translate(-50%,-50%);text-decoration:none;color:var(--navy)}
.stop .dot{width:clamp(48px,11vw,76px);aspect-ratio:1;border-radius:50%;background:var(--paper);border:5px solid #f08a6c;display:grid;place-items:center;
  font-size:clamp(22px,5vw,34px);box-shadow:0 6px 14px rgba(31,61,87,.25);position:relative;transition:transform .15s}
@supports (width:1cqw){ .stop .dot{width:clamp(40px,11.5cqw,76px);font-size:clamp(18px,5.2cqw,34px);border-width:clamp(3px,.8cqw,5px)} }
.stop:hover .dot,.stop:focus-visible .dot{transform:scale(1.08)}
.stop:focus-visible{outline:none}
.stop:focus-visible .dot{outline:4px solid #fff;outline-offset:3px}
.stop.done .dot{border-color:var(--ok)}
.stop.next .dot{animation:pulse 1.4s infinite}
.stop .n{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center}
.stop .badge{position:absolute;top:-6px;right:-8px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--coral);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center}
.stop .lab{position:absolute;white-space:nowrap;background:var(--card);border-radius:12px;padding:4px 10px;font-weight:900;font-size:clamp(11px,2.4cqw,14px);text-align:center;line-height:1.25;box-shadow:0 3px 8px rgba(31,61,87,.18)}
.stop.below .lab{top:calc(100% + 4px);left:50%;transform:translateX(-50%)}
.stop.right .lab{left:calc(100% + 6px);top:50%;transform:translateY(-50%)}
.stop.left .lab{right:calc(100% + 6px);top:50%;transform:translateY(-50%)}
.stop .lab small{display:block;color:#b7791f;font-size:12.5px;letter-spacing:1px}
.stop .lab small .off{color:#d8cdb5}
.side{display:flex;flex-direction:column;gap:12px}
.coachCard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.coachCard img{height:160px}
.coachCard .bubble{width:100%}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl .t{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:15px}
.lvl small{font-weight:800;color:var(--ink);font-size:13px}
.hello{font-weight:900;font-size:15px;color:var(--ink)}
@keyframes pulse{0%,100%{box-shadow:0 6px 14px rgba(31,61,87,.25),0 0 0 0 rgba(255,255,255,.9)}50%{box-shadow:0 6px 14px rgba(31,61,87,.25),0 0 0 12px rgba(255,255,255,0)}}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .side{display:contents}
  .coachCard{order:-1}
  .lvl{order:2}
  .coachCard{flex-direction:row;text-align:left;align-items:center}
  .coachCard img{height:84px}
  .coachCard .btn{display:none}
  .mapWrap{max-width:100%}
}
@media (max-height:520px) and (orientation:landscape){
  .app{padding:6px 12px 12px;gap:6px}
  .brand p{display:none}
  .grid{grid-template-columns:minmax(0,1fr) 240px}
  .side{order:0}
  .mapWrap{max-width:calc((100vh - 70px) * 1224 / 1285)}
  .coachCard img{height:64px}
  .stop .lab{font-size:11px;padding:3px 7px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="chapters.html" title="All chapters" data-ar-label="كل الفصول">
      <div class="logo" aria-hidden="true" id="logo">🏝️</div>
      <div><h1 id="chTitle">Science Island</h1><p id="chSub">Grade 5 · Languages</p></div>
    </a>
    <div class="hud">
      <span class="pill" id="streakPill" title="Daily streak" data-ar-label="أيام متتالية">🔥 <b id="streak">0</b></span>
      <span class="pill" title="Stars" data-ar-label="النجوم">⭐ <b id="stars">0</b> / <span id="starsOf">6</span></span>
      <button class="icon" id="mute" type="button" aria-label="Sound" aria-pressed="false" title="Sound on/off" data-ar-label="الصوت">♪</button>
      <a class="icon" href="chapters.html" aria-label="All chapters" title="All chapters" data-ar-label="كل الفصول">📚</a>
      <a class="icon" href="index.html" aria-label="Change player" title="Change player" data-ar-label="تغيير اللاعب">👤</a>
      <button class="icon" id="bye" type="button" aria-label="Goodbye" title="Goodbye" data-ar-label="باي">👋</button>
    </div>
  </header>
  <main class="grid">
    <div class="mapWrap" id="map" role="list" aria-label="Chapter map" data-ar-label="خريطة الفصل"></div>
    <aside class="side">
      <div class="card coachCard">
        <img id="parrot" src="assets/parrot_point.png" alt="Reesho the parrot" data-ar-label="البغبغان ريشو">
        <div class="bubble" id="bubble"></div>
        <a class="btn primary" id="go" href="arm.html" data-ar="يلّا ◂">Go ▸</a>
      </div>
      <div class="card lvl">
        <div class="hello" id="hello"></div>
        <div class="t"><span id="lvlTitle"></span><span id="lvlXp"></span></div>
        <div class="xpbar" aria-hidden="true"><i id="lvlBar"></i></div>
        <small id="lvlNext"></small>
      </div>
    </aside>
  </main>
</div>
<script src="firebase-config.js?v=20261010c"></script>
<script src="chapters.js?v=20261010c"></script>
<script src="common.js?v=20261010c"></script>
<script>
(async () => {
  'use strict';
  const me = SI.requirePlayer(); if (!me) return;
  const CH = SI.requireChapter(); if (!CH) return;
  SI.applyTheme();
  const $ = s => document.querySelector(s), T = SI.T, AR = SI.isAr(), TITLE = SI.chTitle(CH);
  const P = SI.chProf(), now = Date.now();
  const arm = P.game || {}, quest = P.quest || {}, daily = SI.dailyState();   // "arm" = this chapter's own game
  document.title = `${TITLE} · ${T('Science Island', 'جزيرة العلوم')}`;
  $('#chTitle').textContent = TITLE;
  $('#chSub').textContent = T(`Grade 5 · Languages · Chapter ${CH.n}`, `الصف الخامس · عربي · الفصل ${CH.n}`);
  if (CH.icon) $('#logo').textContent = CH.icon;
  if (CH.map && CH.map.img) $('#map').style.backgroundImage = `url(${CH.map.img})`;
  const due = Object.values(P.cards || {}).filter(c => c.due <= now).length;
  const lv = SI.levelInfo(SI.xp());

  $('#hello').textContent = T(`Hi, ${me.name}!`, `أهلًا يا ${me.name}!`);
  $('#lvlTitle').textContent = `${T('Level', 'المستوى')} ${lv.n} · ${lv.title}`;
  $('#lvlXp').textContent = `${lv.xp} XP`;
  $('#lvlBar').style.width = Math.round(lv.pct * 100) + '%';
  $('#lvlNext').textContent = lv.to ? T(`${lv.to - lv.xp} XP to ${lv.next}`, `باقي ${lv.to - lv.xp} XP للوصول إلى ${lv.next}`) : T('Top level reached!', 'وصلت لأعلى مستوى!');
  $('#streak').textContent = daily.streak;
  const st = SI.chapterStars(CH.id);
  $('#stars').textContent = st.got; $('#starsOf').textContent = st.of;

  $('#bye').onclick = () => { SI.sfx.tick(); SI.bye(); };
  const mute = $('#mute');
  const paint = () => { mute.setAttribute('aria-pressed', SI.isMuted()); mute.setAttribute('aria-label', SI.isMuted() ? T('Sound off', 'الصوت مغلق') : T('Sound on', 'الصوت شغال')); };
  mute.onclick = () => { SI.setMuted(!SI.isMuted()); paint(); }; paint();
  SI.rate.guard(document, 'a[href="chapters.html"], a[href="index.html"]', 'map');   // leaving the chapter: Reesho asks for a rating (once per chapter)

  const stars = n => '★'.repeat(n) + `<span class="off">${'★'.repeat(3 - n)}</span>`;
  const G = CH.game;
  const ALL = [
    G && { key: 'game', icon: G.icon || '🎮', name: T(G.name, G.nameAr || G.name), href: G.href, done: !!arm.stars, sub: stars(arm.stars || 0), hint: T(G.hint || 'Play this chapter’s game!', G.hintAr || 'العب لعبة الفصل!') },
    { key: 'quest', icon: '⭐', name: T('Chapter Quest', 'تحدي الفصل'), href: 'quiz.html#quest', done: !!quest.stars, sub: stars(quest.stars || 0),
      hint: T('Questions on the whole chapter. Your best score goes on the Champions board!', SI.G('أسئلة على الفصل كله. أعلى نتيجة ليك بتدخل لوحة الأبطال!', 'أسئلة على الفصل كله. أعلى نتيجة ليكي بتدخل لوحة الأبطال!')) },
    { key: 'daily', icon: '⚡', name: T('Daily 5', 'خماسية اليوم'), href: 'quiz.html#daily', done: daily.done, sub: daily.done ? T('✓ done today', '✓ خلصتها النهارده') : (daily.streak ? T(`🔥 ${daily.streak} days`, `🔥 ${daily.streak} يوم`) : T('once a day', 'مرة كل يوم')),
      hint: T('5 quick questions every day. Keep your fire streak going!', SI.G('٥ أسئلة سريعة كل يوم. حافظ على سلسلة أيامك!', '٥ أسئلة سريعة كل يوم. حافظي على سلسلة أيامك!')) },
    { key: 'review', icon: '🔁', name: T('Review', 'المراجعة'), href: 'quiz.html#review', badge: due, done: false, sub: due ? T(`${due} waiting`, `${due} مستني`) : T('all clear', 'مفيش حاجة'),
      hint: due ? T(`${due} tricky question${due > 1 ? 's are' : ' is'} waiting for you.`, SI.G(`فيه ${due} سؤال صعب مستنيك.`, `فيه ${due} سؤال صعب مستنيكي.`)) : T('Reesho saves your tricky questions here.', 'ريشو بيحفظ لك الأسئلة الصعبة هنا.') },
    { key: 'board', icon: '🏆', name: T('Champions', 'الأبطال'), href: 'champions.html', done: false, sub: '&nbsp;',
      hint: T('See this week’s top players!', SI.G('شوف أبطال الأسبوع!', 'شوفي أبطال الأسبوع!')) }
  ];
  /* positions come from the chapter (game, quest, daily, review, champions); a chapter without a game skips the first one */
  const POS = (CH.map && CH.map.stops) || [[59.6, 82.9, 'left'], [54.6, 67.1, 'right'], [41.3, 51.4, 'right'], [39.6, 38.1, 'left'], [68.2, 12.5, 'below']];
  const STOPS = ALL.map((s, i) => s && Object.assign(s, { x: POS[i][0], y: POS[i][1], side: POS[i][2] })).filter(Boolean);
  const want = (G && !arm.stars) ? 'game' : !quest.stars ? 'quest' : !daily.done ? 'daily' : due ? 'review' : 'board';
  const next = STOPS.findIndex(s => s.key === want);
  const map = $('#map');
  STOPS.forEach((s, i) => {
    const a = document.createElement('a');
    a.className = `stop ${s.side}` + (s.done ? ' done' : '') + (i === next ? ' next' : '');
    a.href = s.href; a.setAttribute('role', 'listitem'); a.style.left = s.x + '%'; a.style.top = s.y + '%';
    a.setAttribute('aria-label', `${T('Stop', 'محطة')} ${i + 1}: ${s.name}`);
    a.innerHTML = `<span class="dot"><span class="n">${i + 1}</span>${s.icon}${s.badge ? `<span class="badge">${s.badge}</span>` : ''}</span>
      <span class="lab">${s.name}<small id="sub-${s.key}">${s.sub}</small></span>`;
    map.appendChild(a);
  });
  const s = STOPS[next];
  $('#bubble').innerHTML = AR
    ? `${st.got ? `شغل عظيم يا <b>${SI.esc(me.name)}</b>! ` : `أهلًا يا <b>${SI.esc(me.name)}</b>! `}المحطة الجاية: <b>${s.name}</b>. ${s.hint}`
    : `${st.got ? `Great work, <b>${SI.esc(me.name)}</b>! ` : `Welcome, <b>${SI.esc(me.name)}</b>! `}Next stop: <b>${s.name}</b>. ${s.hint}`;
  $('#go').href = s.href;

  // Champions label: my rank this week
  try { const m = await SI.LB.me(); if (m) $('#sub-board').textContent = T(`you are #${m.rank}`, `ترتيبك #${m.rank}`); } catch (e) {}
})();
</script>
</body>
</html>
