<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arm Mechanic · Bones and Muscles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f3d57; --ink:#3a5c75; --card:rgba(255,250,240,.94);
  --primary:#23799f; --primary-d:#1b6182; --mint:#bfe8d6; --mint-d:#8fd3b8;
  --coral:#e2603f; --ok:#2e9e6b; --ok-bg:#d4f4e1; --bad-bg:#fde0d8;
  --radius:22px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--navy);
  background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,.42)),url(assets/bg_lab.jpg) center/cover fixed #cfe9f5;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
.app{max-width:1120px;margin:0 auto;padding:12px 14px 24px;display:flex;flex-direction:column;gap:12px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#8fd3ee,#9fdcc4);display:grid;place-items:center;box-shadow:0 4px 12px rgba(31,61,87,.18)}
.logo svg{width:26px;height:26px}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.2px}
.brand p{margin:0;font-size:13px;font-weight:700;color:var(--ink)}
.hud{display:flex;align-items:center;gap:8px}
.pill{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(31,61,87,.12);position:relative;white-space:nowrap}
.pill b{font-size:18px}
.pill.pop{animation:pop .4s}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--navy);font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 3px 10px rgba(31,61,87,.12)}
.icon[aria-pressed="true"]{opacity:.55;text-decoration:line-through}
.float{position:absolute;right:10px;top:-6px;color:var(--ok);font-weight:900;animation:rise 1s forwards;pointer-events:none}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px;align-items:start}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 8px 28px rgba(31,61,87,.14);padding:14px}
.stageCard svg{display:block;width:100%;height:auto;max-height:62vh;touch-action:none;margin:0 auto;border-radius:16px;
  background:linear-gradient(#eaf7fc,#f6fbf4)}
.stageCard svg:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* meters + controls */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.meter .mhead{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:800;margin-bottom:4px}
.meter small{font-weight:700;color:var(--ink)}
.track{height:12px;border-radius:99px;background:#dbe9f0;overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;transition:width .05s linear}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

/* buttons */
.btn{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:16px;padding:12px 18px;min-height:52px;cursor:pointer;
  background:var(--mint);color:var(--navy);box-shadow:0 4px 0 var(--mint-d);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--mint-d)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-d)}
.btn.big{font-size:22px;padding:14px 34px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:3px solid #f7b267;outline-offset:2px}
.btn.choice{background:#fff;border:3px solid #cfe3ee;box-shadow:none;text-align:left;font-size:17px}
.btn.choice.good{background:var(--ok-bg);border-color:var(--ok)}
.btn.choice.bad{background:var(--bad-bg);border-color:var(--coral)}

/* coach */
.coachRow{display:flex;align-items:flex-end;gap:10px}
#robot{height:150px;width:auto;flex:none;transform-origin:50% 100%}
#robot.hop{animation:hop .5s}
.bubble{position:relative;background:#fff;border:3px solid #cfe3ee;border-radius:20px;padding:12px 14px;font-weight:700;font-size:17px;line-height:1.4;flex:1;min-height:92px}
.bubble::before{content:"";position:absolute;left:-12px;bottom:26px;width:18px;height:18px;background:#fff;border-left:3px solid #cfe3ee;border-bottom:3px solid #cfe3ee;transform:rotate(45deg)}
.kw{color:#c2410c;background:#fff0d9;border-radius:6px;padding:0 4px}
.actions{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.choices{display:grid;gap:10px}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:#dbe9f0}
.dots i.on{background:var(--ok)}
.timer{height:14px;border-radius:99px;background:#dbe9f0;margin-top:12px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--primary);border-radius:99px}
.timer i.low{background:var(--coral)}

/* svg bits */
.chip rect{fill:#fff;stroke:#9fc3d6;stroke-width:2.5}
.chip text{fill:var(--navy);font-weight:900;font-size:14px;text-anchor:middle;pointer-events:none}
.chip text.sub{font-size:11.5px;font-weight:700;fill:#46657c}
.nochips .chip,.nochips .lead{display:none}
.lead{stroke:#7ea6bd;stroke-width:2;stroke-dasharray:4 4;fill:none}
.hit,.chip{pointer-events:none}
.tappable .hit{pointer-events:stroke;cursor:pointer}
.tappable .chip{pointer-events:all;cursor:pointer}
.tappable .chip rect{animation:pulse 1.3s infinite}
.shake{animation:shake .4s}
#grab{cursor:grab}
#grab:active{cursor:grabbing}
.muscle{stroke-width:3;stroke-linejoin:round}
.fiber{fill:none;stroke:#000;stroke-opacity:.16;stroke-width:2;stroke-linecap:round;pointer-events:none}
#arm{--skin:#f6d6b0;--skin-d:#d9a678}
.skinF{fill:var(--skin)}
.skinD{fill:var(--skin-d);stroke:var(--skin-d);stroke-linejoin:round}
.fingerLn{stroke:var(--skin-d);stroke-width:2.4;stroke-linecap:round;fill:none}
.bone{fill:#fff6df;stroke:#cdb98f;stroke-width:2.5;stroke-linejoin:round}
.cartD{fill:none;stroke:#6fb3cf;stroke-width:7}
.cartF{fill:none;stroke:#c3e8f4;stroke-width:3.6}
.tendD{stroke:#bfa465;stroke-width:9}
.tendF{stroke:#fbf0cf;stroke-width:5.5}
.patch{fill:#fbf0cf;stroke:#bfa465;stroke-width:2}
.hl{fill:#fff;opacity:.24;pointer-events:none}
.skins{display:flex;justify-content:center;align-items:center;gap:10px;margin:2px 0 16px;font-weight:800;font-size:14px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cfe3ee;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--primary)}
.sw:focus-visible{outline:3px solid #f7b267;outline-offset:3px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(143,211,238,.45);backdrop-filter:blur(4px)}
.panel{background:#fff8ea;border-radius:28px;padding:22px 26px;max-width:460px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(31,61,87,.25)}
.panel h2{margin:6px 0 4px;font-size:34px;font-weight:900}
.panel p{margin:6px 0 14px;font-weight:700;font-size:17px;line-height:1.45}
.hero{height:170px;width:auto}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.stats span{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px}
.stars{font-size:46px;letter-spacing:6px;color:#f2b134;line-height:1}
.stars .off{color:#e3d9c4}
.banner{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(143,211,238,.4);backdrop-filter:blur(3px);animation:fade .25s;pointer-events:none}
.banner.out{opacity:0;transition:opacity .3s}
.banner div{background:#fff8ea;border-radius:28px;padding:20px 44px;text-align:center;box-shadow:0 14px 40px rgba(31,61,87,.25)}
.banner small{display:block;font-weight:800;color:var(--ink);font-size:16px;letter-spacing:1px;text-transform:uppercase}
.banner strong{font-size:36px;font-weight:900}
.confetti{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 2.1s ease-in forwards}

@keyframes pop{50%{transform:scale(1.15)}}
@keyframes rise{to{transform:translateY(-26px);opacity:0}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-14px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.04,.96)}100%{transform:none}}
@keyframes pulse{50%{stroke:#23799f;stroke-width:4}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fade{from{opacity:0}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .coach{order:-1}
  #robot{height:104px}
  .bubble{font-size:16px;min-height:84px}
  .stageCard svg{max-height:52vh}
  .brand p{display:none}
}

/* touch screens: a fixed background is unreliable on phones and tablets */
@media (hover:none){body{background-attachment:scroll}}

@media (max-width:820px){
  .app{padding:8px 12px 18px;gap:8px}
  .top{gap:6px}
  .logo{width:34px;height:34px}
  .brand h1{font-size:19px}
  .hud{gap:6px;flex-wrap:wrap}
  .pill{padding:6px 11px;font-size:13px}
  .pill b{font-size:16px}
  .icon{width:36px;height:36px;font-size:16px}
  #stagePill .long{display:none}
  .card{padding:10px}
  #robot{height:70px}
  .bubble{font-size:15px;min-height:0;padding:9px 12px}
  .bubble::before{bottom:18px}
  .stageCard svg{max-height:42vh}
  .meters{gap:8px;margin-top:8px}
  .meter .mhead{flex-direction:column;gap:0;font-size:12.5px}
  .controls{margin-top:8px}
  .btn{min-height:48px;font-size:17px;padding:10px 14px}
  .choices{gap:8px}
}
@media (max-height:520px) and (orientation:landscape){
  .app{padding:6px 12px 12px;gap:6px}
  .brand p{display:none}
  .grid{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:10px}
  .coach{order:0}
  .coachRow{align-items:flex-start}
  #robot{height:62px}
  .bubble{font-size:14px;min-height:0;padding:8px 10px}
  .stageCard svg{max-height:56vh}
  .meters{margin-top:4px}
  .meter .mhead{font-size:11px}
  .controls{margin-top:6px}
  .btn{min-height:40px;font-size:15px;padding:7px 12px}
  .panel{padding:14px 18px}
  .hero{height:90px}
  .panel h2{font-size:24px}
}

/* phones: fit the visible screen (svh excludes the browser bars) and keep the buttons above the meters */
@media (max-width:820px){
  .stageCard{display:flex;flex-direction:column}
  .stageCard svg{max-height:max(190px, calc(100vh - 400px));max-height:max(190px, calc(100svh - 400px))}
  .controls{order:2;margin-top:8px}
  .meters{order:3;margin-top:8px}
  .bubble{font-size:14.5px}
}
</style>
</head>
<body>
<noscript>Please turn on JavaScript to play Arm Mechanic.</noscript>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 4.5a2.5 2.5 0 1 1 3.4 2.3l3 7.2A2.5 2.5 0 1 1 16 17.8a2.5 2.5 0 1 1-3.6-1.6l-3-7.2A2.5 2.5 0 0 1 7 4.5Z" fill="#fff8ea" stroke="#1f3d57" stroke-width="1.4"/></svg>
      </div>
      <div><h1>Arm Mechanic</h1><p>Chapter 1 · Bones and Muscles</p></div>
    </div>
    <div class="hud">
      <div class="pill" id="stagePill">Stage 1 of 3</div>
      <div class="pill" id="scorePill">Score <b id="score">0</b></div>
      <button class="icon" id="mute" aria-label="Sound" aria-pressed="false" title="Sound on/off">♪</button>
      <a class="icon" href="./" aria-label="Back to the map" title="Back to the map" style="display:grid;place-items:center;text-decoration:none">⌂</a>
    </div>
  </header>

  <main class="grid">
    <section class="card stageCard">
      <svg id="arm" viewBox="52 0 388 520" role="img" tabindex="0"
           aria-label="An arm showing the inner muscle (biceps) and the outer muscle (triceps) attached to the bones by tendons. Use the arrow keys to bend or stretch it.">
        <defs>
          <path id="upperP"/><path id="foreP"/>
          <ellipse id="thumbE" cx="28" cy="160" rx="8" ry="16" transform="rotate(-14 28 160)"/>
          <path id="humP"/><path id="scapP"/><path id="ulnaP"/><path id="radP"/>
        </defs>

        <!-- skin: outline layer, then fill layer (one clean silhouette) -->
        <g stroke-linejoin="round">
          <use href="#upperP" class="skinD" stroke-width="7"/>
          <circle cx="190" cy="256" r="36" class="skinD" stroke-width="7"/>
          <g id="foreSkinD"><use href="#foreP" class="skinD" stroke-width="7"/><use href="#thumbE" class="skinD" stroke-width="7"/></g>
        </g>
        <use href="#upperP" class="skinF"/>
        <circle cx="190" cy="256" r="36" class="skinF"/>
        <g id="foreSkinF">
          <use href="#foreP" class="skinF"/><use href="#thumbE" class="skinF"/>
          <path d="M-12 197L-12 211M-1 199L-1 214M10 198L10 211" class="fingerLn"/>
        </g>

        <!-- bones -->
        <use href="#scapP" class="bone"/>
        <g id="foreBone"><use href="#ulnaP" class="bone"/><use href="#radP" class="bone"/></g>
        <use href="#humP" class="bone"/><circle cx="192" cy="101" r="17" class="bone"/>
        <circle cx="190" cy="256" r="21" class="cartD"/><circle cx="190" cy="256" r="21" class="cartF"/>

        <!-- tendons, then muscles -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path id="tOut1" class="tendD"/><path id="tOut2" class="tendF"/>
          <path id="tIn1" class="tendD"/><path id="tIn2" class="tendF"/>
        </g>
        <g id="muscles">
          <path id="mOut" class="muscle"/>
          <path id="mIn" class="muscle"/>
          <path id="fOut1" class="fiber"/><path id="fOut2" class="fiber"/>
          <path id="fIn1" class="fiber"/><path id="fIn2" class="fiber"/>
          <path id="hlOut" class="hl"/><path id="hlIn" class="hl"/>
        </g>
        <circle id="oIn" r="4.5" class="patch"/><circle id="oOut" r="4.5" class="patch"/>
        <circle id="pIn" r="5.5" class="patch"/><circle id="pOut" r="5.5" class="patch"/>
        <g id="arrOut" opacity="0"><path d="M0 -5 H18 V-11 L32 0 L18 11 V5 H0Z" fill="#ffe28a" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/></g>
        <g id="arrIn" opacity="0"><path d="M0 -5 H18 V-11 L32 0 L18 11 V5 H0Z" fill="#ffe28a" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/></g>

        <!-- props -->
        <g id="bag" hidden>
          <line x1="0" y1="0" x2="0" y2="20" stroke="#8a6a43" stroke-width="3.5" stroke-linecap="round"/>
          <rect x="-28" y="20" width="56" height="42" rx="7" fill="#efc27f" stroke="#b88a4e" stroke-width="3"/>
          <line x1="-28" y1="33" x2="28" y2="33" stroke="#b88a4e" stroke-width="2"/>
          <line x1="-28" y1="49" x2="28" y2="49" stroke="#b88a4e" stroke-width="2"/>
          <text x="0" y="45" text-anchor="middle" font-size="11" font-weight="900" fill="#8a5a22" style="pointer-events:none">HEAVY</text>
        </g>
        <g id="ball" hidden>
          <circle r="11" fill="#f5926f" stroke="#c9583a" stroke-width="2"/>
          <path d="M-9 -4 Q0 2 9 -4" stroke="#fff3e6" stroke-width="2" fill="none"/>
        </g>

        <!-- hit areas -->
        <line id="grab" stroke="transparent" stroke-width="76" stroke-linecap="round" pointer-events="stroke"/>
        <line id="hitOut" class="hit" stroke="transparent" stroke-width="46" stroke-linecap="round"/>
        <line id="hitIn" class="hit" stroke="transparent" stroke-width="46" stroke-linecap="round"/>

        <!-- labels -->
        <line id="leadOut" class="lead"/><line id="leadIn" class="lead"/>
        <g id="chipOut" class="chip" role="button" tabindex="-1" aria-label="Outer muscle (triceps)">
          <rect x="64" y="12" width="108" height="46" rx="14"/>
          <text x="118" y="32">Outer muscle</text><text x="118" y="49" class="sub">(triceps)</text>
        </g>
        <g id="chipIn" class="chip" role="button" tabindex="-1" aria-label="Inner muscle (biceps)">
          <rect x="324" y="12" width="108" height="46" rx="14"/>
          <text x="378" y="32">Inner muscle</text><text x="378" y="49" class="sub">(biceps)</text>
        </g>
      </svg>

      <div class="meters" id="meters">
        <div class="meter">
          <div class="mhead"><span>Inner muscle <small>(biceps)</small></span><b id="mInTxt"></b></div>
          <div class="track"><i id="mInFill"></i></div>
        </div>
        <div class="meter">
          <div class="mhead"><span>Outer muscle <small>(triceps)</small></span><b id="mOutTxt"></b></div>
          <div class="track"><i id="mOutFill"></i></div>
        </div>
      </div>
      <div class="controls" id="controls">
        <button class="btn" id="btnBend" type="button">Bend</button>
        <button class="btn" id="btnStretch" type="button">Stretch</button>
      </div>
    </section>

    <aside class="card coach">
      <div class="coachRow">
        <img id="robot" src="assets/robot_wave.png" alt="Gizmo, the robot coach">
        <div class="bubble" id="bubble" aria-live="polite"></div>
      </div>
      <div class="actions" id="actions"></div>
      <div class="timer" id="timer" hidden><i></i></div>
    </aside>
  </main>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- geometry ---------- */
const E = { x: 190, y: 256 };                                              // elbow pivot
const A_IN = { x: 214, y: 90 }, A_OUT = { x: 172, y: 124 }, W_OUT = { x: 162, y: 252 };  // muscle origins on the shoulder blade
const LT_IN = 50, LT_OUT = 52, MAXA = 145;                                 // tendon lengths stay constant, only the belly changes
const NAME = { in: 'inner muscle (biceps)', out: 'outer muscle (triceps)' };

let theta = 0, locked = false, masked = false, tapHandler = null;
const listeners = new Set();

const svg = $('#arm');
const el = id => document.getElementById(id);
const f1 = n => n.toFixed(1);
const setLine = (e, a, b) => { e.setAttribute('x1', f1(a.x)); e.setAttribute('y1', f1(a.y)); e.setAttribute('x2', f1(b.x)); e.setAttribute('y2', f1(b.y)); };
const setCircle = (e, p) => { e.setAttribute('cx', f1(p.x)); e.setAttribute('cy', f1(p.y)); };

/* colour helpers: blue (relaxed) -> lilac -> red (contracted) */
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const mixc = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => lerp(v, B[i], t))); };
const heat = c => c < .5 ? mixc('#74b9e8', '#c9a9cf', c / .5) : mixc('#c9a9cf', '#e5533d', (c - .5) / .5);
const shade = (h, f) => rgb2hex(hex2rgb(h).map(v => v * f));

/* smooth closed outline through points (Catmull-Rom -> cubic Bezier) */
function smooth(pts) {
  const n = pts.length, P = i => pts[((i % n) + n) % n];
  let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d + 'Z';
}
/* static shapes. The forearm, ulna and radius are in local coordinates: origin = elbow, +y along the forearm, +x = inner (bending) side */
function buildShapes() {
  const S = {
    upperP: [[190,50],[222,58],[238,84],[238,120],[236,160],[231,205],[226,245],[222,258],[190,264],[158,258],[154,245],[149,205],[144,160],[142,120],[142,84],[158,58]],

/* muscle belly = two Bezier sides (a spindle); shift moves its centre line sideways */
function bezier(A, B, bulge, shift) {
  const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, px = -uy, py = ux;
  const a1 = { x: A.x + ux * L * .3, y: A.y + uy * L * .3 }, b1 = { x: B.x - ux * L * .3, y: B.y - uy * L * .3 };

  return `C${f1(a1.x + px * s)} ${f1(a1.y + py * s)} ${f1(b1.x + px * s)} ${f1(b1.y + py * s)} ${f1(B.x)} ${f1(B.y)}`;
}

}
const fiber = (A, B, w, shift, off) => `M${f1(A.x)} ${f1(A.y)} ${bezier(A, B, 1.35 * w * off, shift)}`;
const along = (A, B, k) => ({ x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k) });

/* ---------- render ---------- */
const MASK_FILL = '#ebc3b6', MASK_STROKE = '#c58f7e';
function render() {
  const th = theta * Math.PI / 180;
  const d = { x: Math.sin(th), y: Math.cos(th) };      // forearm direction
  const n = { x: Math.cos(th), y: -Math.sin(th) };     // inner (bending) side
  const L = (lx, ly) => ({ x: E.x + n.x * lx + d.x * ly, y: E.y + n.y * lx + d.y * ly });  // forearm-local -> screen

  const tf = `translate(${E.x} ${E.y}) rotate(${(-theta).toFixed(2)})`;
  ['foreSkinD', 'foreSkinF', 'foreBone'].forEach(id => el(id).setAttribute('transform', tf));
  setLine(el('grab'), E, L(0, 214));

  const t = clamp(theta / 130, 0, 1), cIn = t, cOut = 1 - t;

  /* inner muscle (biceps): origin on the shoulder blade, tendon ends on the radius */
  const Pin = L(16, 34);
  const vin = { x: Pin.x - A_IN.x, y: Pin.y - A_IN.y }, totIn = Math.hypot(vin.x, vin.y);
  const belIn = Math.max(60, totIn - LT_IN);                            // tendon keeps its length, belly takes the rest
  const Qin = along(A_IN, Pin, belIn / totIn);

  /* outer muscle (triceps): tendon wraps round the back of the elbow to the olecranon */
  const Pout = L(-22, 2);
  const lo = Math.hypot(W_OUT.x - A_OUT.x, W_OUT.y - A_OUT.y);
  const totOut = lo + Math.hypot(Pout.x - W_OUT.x, Pout.y - W_OUT.y);
  const belOut = clamp(totOut - LT_OUT, 60, lo - 6);
  const Qout = along(A_OUT, W_OUT, belOut / lo);

  const wIn = lerp(9, 17, cIn), wOut = lerp(9, 17, cOut);
  el('mIn').setAttribute('d', bezierPath(A_IN, Qin, wIn, 0));
  el('mOut').setAttribute('d', bezierPath(A_OUT, Qout, wOut, 0));
  el('hlIn').setAttribute('d', bezierPath(along(A_IN, Qin, .18), along(A_IN, Qin, .82), wIn * .38, wIn * .42));
  el('hlOut').setAttribute('d', bezierPath(along(A_OUT, Qout, .18), along(A_OUT, Qout, .82), wOut * .38, wOut * .42));
  el('fIn1').setAttribute('d', fiber(A_IN, Qin, wIn, 0, .45)); el('fIn2').setAttribute('d', fiber(A_IN, Qin, wIn, 0, -.45));
  el('fOut1').setAttribute('d', fiber(A_OUT, Qout, wOut, 0, .45)); el('fOut2').setAttribute('d', fiber(A_OUT, Qout, wOut, 0, -.45));

  const dIn = `M${f1(Qin.x)} ${f1(Qin.y)}L${f1(Pin.x)} ${f1(Pin.y)}`;
  const dOut = `M${f1(Qout.x)} ${f1(Qout.y)}Q${f1(W_OUT.x)} ${f1(W_OUT.y)} ${f1(Pout.x)} ${f1(Pout.y)}`;
  ['tIn1', 'tIn2'].forEach(id => el(id).setAttribute('d', dIn));
  ['tOut1', 'tOut2'].forEach(id => el(id).setAttribute('d', dOut));
  setCircle(el('pIn'), Pin); setCircle(el('pOut'), Pout); setCircle(el('oIn'), A_IN); setCircle(el('oOut'), A_OUT);

  paint('mIn', masked ? MASK_FILL : heat(cIn)); paint('mOut', masked ? MASK_FILL : heat(cOut));
  setLine(el('hitIn'), A_IN, Qin); setLine(el('hitOut'), A_OUT, Qout);

  // leader lines from the labels to the muscle bellies
  const mi = along(A_IN, Qin, .5), mo = along(A_OUT, Qout, .5);
  setLine(el('leadIn'), { x: 378, y: 58 }, { x: mi.x + 4, y: mi.y });
  setLine(el('leadOut'), { x: 118, y: 58 }, { x: mo.x - 4, y: mo.y });

  // pull arrows sit beside the tendons: muscles pull, they never push
  const pull = (id, P, T, side, op) => {
    const dx = T.x - P.x, dy = T.y - P.y, Ln = Math.hypot(dx, dy) || 1, ux = dx / Ln, uy = dy / Ln;
    let px = -uy, py = ux; if (px * side < 0) { px = -px; py = -py; }
    const M = along(P, T, .5), tail = { x: M.x - ux * 15 + px * 17, y: M.y - uy * 15 + py * 17 };
    const e = el(id);
    e.setAttribute('transform', `translate(${f1(tail.x)} ${f1(tail.y)}) rotate(${(Math.atan2(uy, ux) * 180 / Math.PI).toFixed(1)}) scale(.9)`);
    e.setAttribute('opacity', masked ? 0 : op.toFixed(2));
  };
  pull('arrIn', Pin, Qin, 1, smooth01(.6, .85, cIn));
  pull('arrOut', Pout, W_OUT, -1, smooth01(.6, .85, cOut));

  // props
  const H = L(0, 196);
  const bag = el('bag');
  if (!bag.hasAttribute('hidden')) bag.setAttribute('transform', `translate(${f1(H.x)} ${f1(H.y)})`);
  if (ball.attached) { const B0 = L(2, 206); ball.x = B0.x; ball.y = B0.y; }
  if (ball.on) el('ball').setAttribute('transform', `translate(${f1(ball.x)} ${f1(ball.y)}) rotate(${ball.rot})`);

}
function paint(id, col) {
  const e = el(id);

  e.setAttribute('stroke-dasharray', masked ? '6 5' : '');
}
const smooth01 = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
function meter(prefix, c) {
  el(prefix + 'Fill').style.width = (c * 100).toFixed(0) + '%';
  el(prefix + 'Fill').style.background = heat(c);
  el(prefix + 'Txt').textContent = c >= .65 ? 'Contracted · hard' : c <= .35 ? 'Relaxed · soft' : 'Changing…';
}

/* ---------- skin tone ---------- */
const SKINS = [['#f6d6b0', '#d9a678'], ['#ebbd8f', '#c98f5c'], ['#c98d5f', '#9d6538'], ['#94603f', '#633f27']];
function applySkin(i) {

  svg.style.setProperty('--skin', f); svg.style.setProperty('--skin-d', d);
}

/* ---------- movement ---------- */
function setTheta(v) { theta = clamp(v, 0, MAXA); render(); listeners.forEach(f => f(theta)); }
let tw = null, twDone = null;
function cancelTween() {
  if (tw) { cancelAnimationFrame(tw); tw = null; }
  if (twDone) { const r = twDone; twDone = null; r(); }   // never leave a caller waiting
}
function tweenTo(target, ms = 650) {
  cancelTween();
  return new Promise(res => {
    if (reduceMotion) { setTheta(target); return res(); }
    twDone = res;
    const from = theta, t0 = performance.now();
    const step = now => {
      const k = clamp((now - t0) / ms, 0, 1), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      setTheta(lerp(from, target, e));

    };

  });
}
function waitTheta(pred) {
  return new Promise(res => {
    if (pred(theta)) return res();
    const f = t => { if (pred(t)) { listeners.delete(f); res(); } };
    listeners.add(f);
  });
}

/* drag the forearm */
let dragging = false;
function svgPoint(e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
el('grab').addEventListener('pointerdown', e => {
  if (locked) return;
  dragging = true; cancelTween();
  svg.setPointerCapture(e.pointerId); e.preventDefault();
});
svg.addEventListener('pointermove', e => {
  if (!dragging || locked) return;
  const p = svgPoint(e);
  let a = Math.atan2(p.x - E.x, p.y - E.y) * 180 / Math.PI;
  if (a < -90) a = MAXA; else if (a < 0) a = 0;
  setTheta(a);
});
const endDrag = () => { dragging = false; };
svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('keydown', e => {
  if (locked) return;

  if (k === 'ArrowUp' || k === 'ArrowRight') { setTheta(theta + 10); e.preventDefault(); }
  if (k === 'ArrowDown' || k === 'ArrowLeft') { setTheta(theta - 10); e.preventDefault(); }
});

el('btnStretch').onclick = () => { if (!locked) { sfx.tick(); tweenTo(0); } };

}

/* tap targets */
function setTappable(v) { svg.classList.toggle('tappable', v); el('chipIn').tabIndex = el('chipOut').tabIndex = v ? 0 : -1; }
['In', 'Out'].forEach(k => {

  el('hit' + k).addEventListener('click', go);

/* ---------- props: bag + ball ---------- */

  return new Promise(res => {
    ball.attached = false;

    const step = () => {
      ball.x += vx; ball.y += vy; vy += .38; ball.rot += 14;

/* ---------- sound ---------- */
const store = {
  load() { try { return JSON.parse(localStorage.getItem('armMechanic.v1')) || {}; } catch (e) { return {}; } },
  save(o) { try { localStorage.setItem('armMechanic.v1', JSON.stringify(o)); } catch (e) {} }
};
let muted = !!store.load().muted, ac = null;
function tone(f, d = .12, type = 'sine', v = .08, delay = 0) {
  if (muted) return;

    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .03);
  } catch (e) {}
}
const sfx = {
  ok() { tone(660, .12); tone(880, .2, 'sine', .08, .1); },
  bad() { tone(220, .25, 'triangle', .09); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .2, 'sine', .08, i * .11)); },

/* ---------- coach, score, helpers ---------- */
const POSES = ['wave', 'think', 'celebrate', 'thumbs', 'sad', 'point'];

function say(html, p) { bubble.innerHTML = html; if (p) pose(p); }
function mk(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function btn(text, cls = '') { const b = mk('button', 'btn ' + cls, text); b.type = 'button'; return b; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const f = mk('span', 'float', '+' + n); p.appendChild(f); setTimeout(() => f.remove(), 1000);
}

/* tap question: student taps a muscle */
function askTap(correct, { ok, hint, points = 20 }) {
  return new Promise(res => {
    let tries = 0, done = false;
    lock(true); setMask(true); setTappable(true);
    const finish = good => {
      tapHandler = null; setTappable(false); setMask(false);
      if (good) { addScore(tries === 1 ? points : 5); sfx.ok(); confetti(18); say(ok, 'celebrate'); }
      else { sfx.bad(); say(`The <b>${NAME[correct]}</b> is the one. See its colour now? ${ok}`, 'think'); }
      nextBtn().then(res);
    };
    tapHandler = which => {
      if (done) return;
      tries++;
      if (which === correct) { done = true; finish(true); }
      else { mistakes++; sfx.bad(); shake(which); if (tries >= 2) { done = true; finish(false); } else say(hint, 'sad'); }
    };
  });
}

/* multiple choice */
function askChoice({ options, correct, hint, ok, count = true, points = 20 }) {
  return new Promise(res => {
    actions.innerHTML = '';
    const wrap = mk('div', 'choices'); let tries = 0, done = false;
    const bs = shuffle(options.map(o => ({ o, right: o === correct }))).map(({ o, right }) => {
      const b = btn(o, 'choice');
      b.onclick = () => {
        if (done) return;
        tries++;
        if (right) { done = true; b.classList.add('good'); sfx.ok(); if (points) addScore(tries === 1 ? points : 5); say(ok, 'thumbs'); finish(); }
        else {
          b.classList.add('bad'); b.disabled = true; sfx.bad(); if (count) mistakes++;
          if (tries >= 2) { done = true; bs.forEach(x => { if (x.dataset.right) x.classList.add('good'); }); say(`The answer is <b>${correct}</b>. ${ok}`, 'think'); finish(); }
          else say(hint, 'sad');
        }
      };
      if (right) b.dataset.right = '1';
      wrap.appendChild(b); return b;
    });
    actions.appendChild(wrap);
    function finish() { bs.forEach(b => b.disabled = true); setTimeout(() => nextBtn().then(res), 500); }
  });
}

/* timed tap for the speed round */
function timedTap(target, ms) {
  return new Promise(res => {
    const timer = $('#timer'), bar = timer.firstElementChild; timer.hidden = false; bar.style.width = '100%'; bar.classList.remove('low');
    const t0 = performance.now(); let done = false;
    setTappable(true);
    const end = r => { if (done) return; done = true; clearInterval(iv); tapHandler = null; setTappable(false); timer.hidden = true; res(r); };
    const iv = setInterval(() => {
      const left = 1 - (performance.now() - t0) / ms;
      bar.style.width = Math.max(0, left * 100) + '%'; bar.classList.toggle('low', left < .3);
      if (left <= 0) end({ ok: false, timeout: true, left: 0 });
    }, 50);
    tapHandler = which => end({ ok: which === target, timeout: false, which, left: Math.max(0, 1 - (performance.now() - t0) / ms) });
  });
}

/* ---------- the game ---------- */
async function stage1() {
  setStage(1, 'Warm Up');
  setUI({ chips: true, meters: true, controls: true }); lock(false); setMask(false); showBag(false); showBall(false);
  await tweenTo(0, 400);
  say(`Let’s watch your arm muscles work! <b>Drag the hand</b> up to <b class="kw">bend</b> the arm, or press <b>Bend</b>.`, 'point');
  await waitTheta(t => t >= 115);
  addScore(10); sfx.ok();
  say(`Look at the <b>inner muscle</b>. It got <b class="kw">thick and hard</b>. We say it <b class="kw">contracts</b>. The <b>outer muscle</b> <b class="kw">relaxes</b>: it is soft and thin.`, 'thumbs');
  await nextBtn();

  say(`Now try it on <b>your own arm</b>! Bend it hard and touch the muscle on the inside. How does it feel?`, 'think');
  await askChoice({ options: ['Hard', 'Soft'], correct: 'Hard', count: false, points: 10,
    hint: `Try again! A muscle that <b>contracts</b> becomes harder.`,
    ok: `A contracting muscle gets <b class="kw">hard</b>.` });

  say(`Now <b>stretch</b> your arm out straight. Drag the hand down or press <b>Stretch</b>.`, 'point');
  await waitTheta(t => t <= 12);
  addScore(10); sfx.ok();
  say(`Now the <b>outer muscle</b> <b class="kw">contracts</b> and gets hard, and the <b>inner muscle</b> <b class="kw">relaxes</b>.`, 'thumbs');
  await nextBtn();

  say(`Bend and stretch again. Watch the two muscles take <b class="kw">turns</b>!`, 'point');
  const dots = mk('div', 'dots', '<i></i><i></i><i></i><i></i>'); actions.innerHTML = ''; actions.appendChild(dots);
  await new Promise(res => {
    let phase = 'bend', n = 0;
    const f = t => {
      if (phase === 'bend' && t >= 115) { phase = 'stretch'; n++; }
      else if (phase === 'stretch' && t <= 12) { phase = 'bend'; n++; }
      else return;
      dots.children[n - 1].classList.add('on'); sfx.tick();
      if (n >= 4) { listeners.delete(f); res(); }
    };

  });
  addScore(10); sfx.win(); confetti();
  say(`Two muscles, working in <b class="kw">turns</b>! When one <b>contracts</b>, the other <b>relaxes</b>.`, 'celebrate');

}

    const f = t => { if (t >= 110) armed = true; if (armed && t <= 30) { listeners.delete(f); res(); } };
    listeners.add(f);
  });
  lock(true); sfx.tick();
  await throwBall(); showBall(false);
  say(`What a throw! <b>Which muscle contracted</b> to stretch your arm? <b>Tap it!</b>`, 'think');
  await askTap('out', {
    hint: `Not quite. When you <b>stretch</b> the arm, the other muscle does the work. Try again!`,
    ok: `The <b>outer muscle</b> contracts and <b class="kw">pulls</b> to stretch the arm.`
  });
  lock(false);

  // Mission 3: quick questions
  setUI({ chips: true, meters: false, controls: false });
  say(`<b>Mission 3:</b> Quick questions!`, 'wave');
  await sleep(900);
  say(`Muscles move bones by ______ them.`, 'think');
  await askChoice({ options: ['pushing', 'pulling'], correct: 'pulling',
    hint: `Think about the arrow on the muscle. Which way does it go?`, ok: `Muscles never push. They <b class="kw">pull</b> the bones.` });
  say(`To pull a bone, a muscle must ______.`, 'think');
  await askChoice({ options: ['relax', 'contract', 'expand'], correct: 'contract',
    hint: `Remember the bag: the muscle that works gets hard and short.`, ok: `A muscle <b class="kw">contracts</b> to pull a bone.` });
  say(`When a muscle contracts, it becomes ______.`, 'think');
  await askChoice({ options: ['thin and soft', 'thick and hard'], correct: 'thick and hard',
    hint: `Remember what you felt on your own arm.`, ok: `A contracted muscle is <b class="kw">thick and hard</b>.` });
  sfx.win(); confetti();
  say(`Stage 2 complete! You really know your muscles.`, 'celebrate');
  await nextBtn('Go to Stage 3 ▸');
}

async function stage3() {
  setStage(3, 'Speed Round');
  await banner('Stage 3', 'Speed Round');
  const ROUNDS = 8;
  setUI({ chips: true, meters: false, controls: false }); lock(true); showBag(false); showBall(false);
  say(`Speed Round! I will show an arm. <b>Tap the right muscle</b> before time runs out. ${ROUNDS} rounds!`, 'point');
  await nextBtn('Go! ▸');
  let streak = 0, last = '';
  for (let i = 1; i <= ROUNDS; i++) {
    let bent, ask;
    do { bent = Math.random() < .5; ask = Math.random() < .5 ? 'contracted' : 'relaxed'; } while ((bent ? 'b' : 's') + ask === last);
    last = (bent ? 'b' : 's') + ask;
    setMask(false);
    await tweenTo(bent ? 132 : 6, 420);
    setMask(true);
    const target = ask === 'contracted' ? (bent ? 'in' : 'out') : (bent ? 'out' : 'in');
    say(`Round ${i} of ${ROUNDS}: Tap the muscle that is <b class="kw">${ask}</b>.`, 'point');
    const r = await timedTap(target, 8000);
    setMask(false);
    if (r.ok) {
      streak++;
      const pts = 10 + Math.round(r.left * 10) + (streak >= 3 ? 5 : 0);
      addScore(pts); sfx.ok();
      say(`Correct! ${streak >= 3 ? `<b class="kw">Streak ×${streak}</b> ` : ''}The ${NAME[target]} is ${ask}.`, 'thumbs');
    } else {
      streak = 0; mistakes++; sfx.bad();
      say(`${r.timeout ? 'Time’s up!' : 'Not quite.'} The ${NAME[target]} is ${ask}.`, 'sad');
    }
    await sleep(1700);
  }
}

function results() {
  const stars = mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1;
  const prev = store.load();
  const best = Math.max(prev.best || 0, score);
  store.save({ ...prev, best, stars: Math.max(prev.stars || 0, stars), plays: (prev.plays || 0) + 1 });
  sfx.win(); confetti(60);
  const o = mk('div', 'overlay');
  o.innerHTML = `<div class="panel">
    <img class="hero" src="assets/robot_celebrate.png" alt="">
    <h2>Chapter complete!</h2>
    <div class="stars" aria-label="${stars} of 3 stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div>
    <div class="stats"><span>Score: ${score}</span><span>Best: ${best}</span></div>
    <p>Muscles <b>contract</b> and <b>pull</b> the bones to move your body. Come back tomorrow to keep it fresh!</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="btn primary big" href="quiz.html#lesson1" style="text-decoration:none">Muscles quiz ▸</a>
      <a class="btn" href="./" style="text-decoration:none;display:inline-grid;place-items:center">Back to map</a>
      <button class="btn" id="again" type="button">Play again</button>
    </div>
  </div>`;
  document.body.appendChild(o);
  $('#again', o).onclick = () => location.reload();
}

function intro() {
  return new Promise(res => {
    const s = store.load();
    const o = mk('div', 'overlay');
    o.innerHTML = `<div class="panel">
      <img class="hero" src="assets/robot_wave.png" alt="">
      <h2>Arm Mechanic</h2>
      <p>Meet Gizmo! Help it find out how <b>muscles</b> move the <b>bones</b> in your arm.</p>
      <div class="skins"><span>Arm colour:</span>${SKINS.map((c, i) => `<button type="button" class="sw" data-i="${i}" aria-label="Skin tone ${i + 1}" aria-pressed="${i === (s.skin || 0)}" style="background:${c[0]}"></button>`).join('')}</div>
      ${s.best ? `<div class="stats"><span>Best score: ${s.best}</span><span>Stars: ${'★'.repeat(s.stars || 0)}${'☆'.repeat(3 - (s.stars || 0))}</span></div>` : ''}
      <button class="btn primary big" id="start" type="button">Start</button>
    </div>`;
    document.body.appendChild(o);
    o.querySelectorAll('.sw').forEach(sw => sw.onclick = () => {
      const i = +sw.dataset.i; applySkin(i); const st = store.load(); st.skin = i; store.save(st);
      o.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', x === sw));
    });
    const b = $('#start', o); b.focus();
    b.onclick = () => { sfx.tick(); o.remove(); res(); };
  });
}

async function main() {
  setUI({ chips: true, meters: true, controls: true });
  applySkin(store.load().skin || 0);
  setTheta(0);
  say(`Hi! I’m Gizmo.`, 'wave');
  await intro();
  await stage1();
  await stage2();
  await stage3();
  results();
}
render();
main().catch(err => console.error(err));

// small hook for automated tests
window.__arm = { setTheta, get theta() { return theta; } };
})();
</script>
</body>
