<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Island · Bones and Muscles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3d57;--ink:#3a5c75;--card:rgba(255,250,240,.95);--primary:#23799f;--gold:#f2b134;--coral:#e2603f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy);
  background:linear-gradient(#bfe9f7,#8fd3ee 60%,#7cc8e8);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.app{max-width:1060px;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#fff3c4,#9fdcc4);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 12px rgba(31,61,87,.18)}
.brand h1{margin:0;font-size:24px;font-weight:900}
.brand p{margin:0;font-size:13px;font-weight:800;color:var(--ink)}
.pill{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 10px rgba(31,61,87,.12)}
.pill b{color:#b7791f;font-size:18px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.mapWrap{position:relative;width:100%;max-width:680px;margin:0 auto;aspect-ratio:1224/1285;border-radius:26px;overflow:hidden;
  box-shadow:0 10px 34px rgba(31,61,87,.22);background:url(assets/map_island.jpg) center/cover #8fd3ee}
.stop{position:absolute;transform:translate(-50%,-50%);text-decoration:none;color:var(--navy)}
.stop .dot{width:clamp(50px,11vw,76px);aspect-ratio:1;border-radius:50%;background:#fff8ea;border:5px solid #f08a6c;display:grid;place-items:center;
  font-size:clamp(22px,5vw,34px);box-shadow:0 6px 14px rgba(31,61,87,.25);position:relative;transition:transform .15s}
.stop:hover .dot,.stop:focus-visible .dot{transform:scale(1.08)}
.stop:focus-visible{outline:none}
.stop:focus-visible .dot{outline:4px solid #fff;outline-offset:3px}
.stop.done .dot{border-color:#2e9e6b}
.stop.next .dot{animation:pulse 1.4s infinite}
.stop .n{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center}
.stop .due{position:absolute;top:-6px;right:-8px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--coral);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center}
.stop .lab{position:absolute;white-space:nowrap;background:var(--card);border-radius:12px;padding:4px 10px;font-weight:900;font-size:clamp(11.5px,2.6vw,14px);text-align:center;line-height:1.2;box-shadow:0 3px 8px rgba(31,61,87,.18)}
.stop.below .lab{top:calc(100% + 4px);left:50%;transform:translateX(-50%)}
.stop.right .lab{left:calc(100% + 6px);top:50%;transform:translateY(-50%)}
.stop.left .lab{right:calc(100% + 6px);top:50%;transform:translateY(-50%)}
.stop .lab small{display:block;color:var(--gold);font-size:13px;letter-spacing:2px}
.stop .lab small .off{color:#d8cdb5}
.card{background:var(--card);border-radius:22px;box-shadow:0 8px 28px rgba(31,61,87,.14);padding:16px}
.coach{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.coach img{height:170px;width:auto}
.bubble{background:#fff;border:3px solid #cfe3ee;border-radius:20px;padding:12px 14px;font-weight:800;font-size:17px;line-height:1.4;width:100%}
.btn{display:inline-block;font:inherit;font-weight:900;font-size:18px;border:0;border-radius:16px;padding:12px 18px;cursor:pointer;background:var(--primary);color:#fff;box-shadow:0 4px 0 #1b6182;text-decoration:none}
.btn:focus-visible{outline:3px solid #f7b267;outline-offset:2px}
.legend{font-size:13px;font-weight:700;color:var(--ink);margin:0}
@keyframes pulse{0%,100%{box-shadow:0 6px 14px rgba(31,61,87,.25),0 0 0 0 rgba(255,255,255,.9)}50%{box-shadow:0 6px 14px rgba(31,61,87,.25),0 0 0 12px rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .coach{order:-1;flex-direction:row;text-align:left;align-items:center}
  .coach img{height:90px}
  .coach .btn{display:none}
  .coach .legend{display:none}
  .coach .bubble{flex:1;font-size:16px}
  .brand p{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">🏝️</div>
      <div><h1>Science Island</h1><p>Grade 5 · Chapter 1 · Bones and Muscles</p></div>
    </div>
    <div class="pill" id="starsPill">Stars <b id="stars">0</b> / 12</div>
  </header>
  <main class="grid">
    <div class="mapWrap" id="map" role="list" aria-label="Island map with five stops"></div>
    <aside class="card coach">
      <img id="robot" src="assets/robot_point.png" alt="Gizmo, the robot coach">
      <div class="bubble" id="bubble"></div>
      <a class="btn" id="go" href="arm.html">Go ▸</a>
      <p class="legend">Follow the path from the dock to the waterfall. Each stop gives up to 3 stars.</p>
    </aside>
  </main>
</div>
<script>
(() => {
'use strict';
const read = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } };
const arm = read('armMechanic.v1'), sci = read('g5sci.v1');
const lessons = sci.lessons || {}, cards = sci.cards || {}, now = Date.now();
const due = Object.values(cards).filter(c => c.due <= now).length;
const STOPS = [
  { x: 59.6, y: 82.9, icon: '🦾', name: 'Arm Mechanic', href: 'arm.html', stars: arm.stars || 0, hint: 'See your muscles pull your bones!', side: 'left' },
  { x: 54.6, y: 67.1, icon: '💪', name: 'Muscles quiz', href: 'quiz.html#lesson1', stars: (lessons[1] || {}).stars || 0, hint: 'Quiz time: muscles that contract and relax.', side: 'right' },
  { x: 41.3, y: 51.4, icon: '🦴', name: 'Bones & Joints', href: 'quiz.html#lesson2', stars: (lessons[2] || {}).stars || 0, hint: 'Joints, cartilage and how bones move.', side: 'right' },
  { x: 39.6, y: 38.1, icon: '🩻', name: 'The Skeleton', href: 'quiz.html#lesson3', stars: (lessons[3] || {}).stars || 0, hint: 'Skull, ribs and the backbone.', side: 'left' },
  { x: 68.2, y: 12.5, icon: '🔁', name: 'Review', href: 'quiz.html#review', review: true, hint: due ? `${due} tricky question${due > 1 ? 's are' : ' is'} waiting for you.` : 'Gizmo keeps your tricky questions here.', side: 'below' }
];
const total = STOPS.reduce((a, s) => a + (s.stars || 0), 0);
document.getElementById('stars').textContent = total;
let next = STOPS.findIndex(s => !s.review && !s.stars);
if (next < 0) next = due ? 4 : -1;
const map = document.getElementById('map');
STOPS.forEach((s, i) => {
  const a = document.createElement('a');
  a.className = 'stop ' + s.side + (s.stars ? ' done' : '') + (i === next ? ' next' : '');
  a.href = s.href; a.setAttribute('role', 'listitem');
  a.style.left = s.x + '%'; a.style.top = s.y + '%';
  const starTxt = s.review ? (due ? `${due} to review` : '&nbsp;') : '★'.repeat(s.stars) + `<span class="off">${'★'.repeat(3 - s.stars)}</span>`;
  a.setAttribute('aria-label', `Stop ${i + 1}: ${s.name}` + (s.review ? `, ${due} to review` : `, ${s.stars} of 3 stars`));
  a.innerHTML = `<span class="dot"><span class="n">${i + 1}</span>${s.icon}${s.review && due ? `<span class="due">${due}</span>` : ''}</span>
    <span class="lab">${s.name}<small>${starTxt}</small></span>`;
  map.appendChild(a);
});
const bubble = document.getElementById('bubble'), go = document.getElementById('go');
if (next >= 0) {
  const s = STOPS[next];
  bubble.innerHTML = (total ? 'Great progress! ' : 'Welcome to Science Island! ') + `Next stop: <b>${s.name}</b>. ${s.hint}`;
  go.href = s.href;
} else {
  bubble.innerHTML = 'You visited every stop! Come back in a few days. Gizmo will have review questions ready.';
  document.getElementById('robot').src = 'assets/robot_celebrate.png';
  go.href = 'quiz.html#review'; go.textContent = 'Review ▸';
}
})();
</script>
</body>
</html>
